apply plugin: 'com.android.application'

// 원본 이미지 파일을 복제·편집하지 않고 APK 생성 시에만 함께 묶는다.
def bundledArt = layout.buildDirectory.dir('generated/game-art')
tasks.register('bundleGameArt', Sync) {
    into bundledArt
    from('../../../public/battle') {
        include 'sprites/*.webp', 'sprites/*.png', 'bg/*.jpg', 'bg/*.webp', 'icons/*.png'
        into 'game-art/duel'
    }
    from('../../../public/thumbs') {
        include '*.jpg'
        into 'game-art/thumbs'
    }
    // 검증된 등록증만 APK에 추가한다. 웹 경로·원본 캐릭터·게임 규칙은 바꾸지 않는다.
    from('../../../art/gpt/registration-v1') {
        include 'manifest.json', 'component/layout.json', 'component/application-animation.json'
        include 'resources/cards/*.webp', 'resources/application-envelope-atlas.png'
        include 'resources/fonts/Noto-CJK-LICENSE.txt'
        into 'native/registration-v1'
    }
}

android {
    namespace = "org.dpdns.gmm"
    sourceSets.main.assets.srcDir(bundledArt)
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Play 출시 번들만 -PgmmApplicationId=org.gmm 으로 바꿔 만든다. 기본값(시험판·기존 설치)은 그대로.
        applicationId project.findProperty('gmmApplicationId') ?: "org.dpdns.gmm.native.revised"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play 출시 번들은 올린 번호보다 커야 해서 -PgmmVersionCode=79 처럼 지정한다. 기본값은 기존 78.
        versionCode((project.findProperty('gmmVersionCode') ?: '78') as int)
        versionName "2.2.4-native"
        // 카카오 로그인 복귀 주소(서버가 gmmrevised://auth로 돌려보낸다). 미리보기판도 같은 주소를 써서 카카오 로그인이 된다.
        // 정식 앱과 함께 설치돼 있으면 로그인 복귀 때 Android가 어느 앱으로 열지 묻는다 → 로그인을 시작한 앱을 고른다.
        manifestPlaceholders = [authScheme: "gmmrevised"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Emit each result immediately so an interrupted runner still identifies
            // the last started/completed method without requiring final JUnit XML.
            testLogging {
                events 'started', 'passed', 'skipped', 'failed'
                exceptionFormat = 'full'
            }
            // Render suites retain large native bitmap caches. Recycle the single
            // test worker between bounded class batches; do not skip or shard tests.
            maxParallelForks = 1
            forkEvery = 10
            if (project.hasProperty('nativeReviewTokenFile')) {
                dependsOn 'prepareNativeReviewSdk'
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir', new File(buildDir, 'native-review-sdk').absolutePath
            } else {
                exclude '**/NativeRenderReviewTest*'
            }
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'maven.repo.local', new File(System.getProperty('java.io.tmpdir'), 'gmm-robolectric-cache').absolutePath
            systemProperty 'gmm.nativeReviewTokenFile', project.findProperty('nativeReviewTokenFile') ?: ''
            systemProperty 'gmm.nativeReviewOutput', project.findProperty('nativeReviewOutput') ?: new File(buildDir, 'native-review').absolutePath
            systemProperty 'gmm.elementalFixtureDir', project.findProperty('elementalReviewFixtureDir') ?: ''
            ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort', 'http.nonProxyHosts'].each { key ->
                if (System.getProperty(key)) systemProperty key, System.getProperty(key)
            }
            maxHeapSize = '2g'
        }
    }
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField "String", "SERVER_URL", "\"https://gmm.dpdns.org\""
    }
    // 기존 앱과 업데이트 서명을 이어가기 위한 외부 키. 키·암호는 저장소에 넣지 않는다.
    def nativeKeystore = System.getenv('GMM_ANDROID_KEYSTORE')
    if (nativeKeystore) {
        ['GMM_ANDROID_STORE_PASSWORD', 'GMM_ANDROID_KEY_ALIAS', 'GMM_ANDROID_KEY_PASSWORD'].each { name ->
            if (!System.getenv(name)) throw new GradleException("${name} 설정이 필요해요.")
        }
        signingConfigs {
            nativeRelease {
                storeFile file(nativeKeystore)
                storePassword System.getenv('GMM_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('GMM_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('GMM_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "SERVER_URL", "\"${project.findProperty('nativeServer') ?: 'https://gmm.dpdns.org'}\""
        }
        // 기존 정식 앱(80판 등)을 지우지 않고 옆에 따로 설치해 보는 검수용. 패키지 이름이 달라 업데이트 설치가 아니다.
        preview {
            initWith debug
            applicationIdSuffix ".r1preview"
            // 설치된 미리보기가 어느 커밋에서 나왔는지 앱 설정의 「Android 버전」에서 바로 보이게 한다.
            versionNameSuffix "-r1preview-" + (System.getenv('GITHUB_SHA')?.take(7) ?: 'local')
            matchingFallbacks = ['debug']
        }
        release {
            if (nativeKeystore) signingConfig signingConfigs.nativeRelease
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.named('preBuild').configure { dependsOn('bundleGameArt') }

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

}



try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// 선택적으로 실행하는 네이티브 화면 검토용 Android SDK. 기본 APK에는 포함하지 않는다.
configurations { nativeReviewSdk; nativeReviewLegacySdk; nativeReviewOreoSdk }
dependencies {
    nativeReviewSdk 'org.robolectric:android-all-instrumented:15-robolectric-13954326-i7'
    nativeReviewLegacySdk 'org.robolectric:android-all-instrumented:7.0.0_r1-robolectric-r1-i7'
    nativeReviewOreoSdk 'org.robolectric:android-all-instrumented:8.0.0_r4-robolectric-r1-i7'
}
tasks.register('prepareNativeReviewSdk', Copy) {
    from configurations.nativeReviewSdk
    from configurations.nativeReviewLegacySdk
    from configurations.nativeReviewOreoSdk
    into layout.buildDirectory.dir('native-review-sdk')
}



// 원본은 Git에 보존하고, APK에는 셀 256px 파생 시트만 넣는다.
def upper33Source = file('../../../art/gpt/upper33-animation-v1')
def upper33Runtime = file('../../../art/gpt/upper33-runtime-v1')
def upper33Generator = file('../../../scripts/PrepareUpper33Art.java')
def upper33Generated = layout.buildDirectory.dir('generated/upper33')
def upper33Webp = file('../../../scripts/upper33-webp.py')
tasks.register('prepareUpper33Art') {
    inputs.dir upper33Source
    inputs.dir upper33Runtime
    inputs.file upper33Generator
    inputs.file upper33Webp
    outputs.dir upper33Generated
    doLast {
        def out = upper33Generated.get().asFile
        delete out
        // Gradle 실행 JDK 17 이상을 사용한다. 외부 다운로드/서버 인증은 없다.
        exec {
            commandLine new File(System.getProperty('java.home'), 'bin/java').absolutePath,
                '-Djava.awt.headless=true', upper33Generator.absolutePath,
                upper33Source.absolutePath, new File(upper33Runtime, 'sources.tsv').absolutePath,
                new File(upper33Runtime, 'catalog.json').absolutePath, out.absolutePath
        }
        // PNG 그대로면 APK가 약 125MB 늘어난다(Play 기본 모듈 한도 초과). 같은 셀을 WebP로 바꾼다.
        exec {
            commandLine 'python3', upper33Webp.absolutePath, out.absolutePath
        }
    }
}
tasks.named('bundleGameArt').configure {
    dependsOn 'prepareUpper33Art'
    from(upper33Generated) { into 'native/upper33-v1' }
}
