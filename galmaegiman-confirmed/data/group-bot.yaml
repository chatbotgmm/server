# 단체방(그룹) 챗봇 응답 상한·금지 문구. 코드: src/group/
#
# 근거 구분
#   [카카오] 카카오 공식 문서·그룹 챗봇 beta 가이드 덱에 적힌 값
#   [우리]   카카오가 숫자를 정하지 않아 우리가 정한 값(바꿔도 됨)
# 덱 번호는 「카카오톡 그룹 챗봇(beta) 가이드」 슬라이드. 한 규정이 여러 장에 걸쳐 있으면 함께 적었어요.
version: GROUP_BOT_V1

limits:
  outputs: 2           # [우리] 말풍선 개수. 카카오 최대 3개(응답 타입별 JSON 포맷 문서). 한 화면을 가리지 않게(덱 24·43) 2개로
  textChars: 300       # [우리] 텍스트 말풍선 1개 글자 수. 카카오 최대 1,000자(500자 넘으면 '전체 보기')
  textLines: 10        # [우리] 텍스트 말풍선 1개 줄 수
  listItems: 5         # [카카오] 리스트 카드 항목 최대 5개
  itemCardItems: 5     # [우리] 아이템 카드 목록 수. 카카오 단일형 최대 10개
  quickReplies: 5      # [우리] 바로가기 버튼 수. 카카오 최대 10개
  buttonLabel: 14      # [카카오] 버튼 문구 14자(가로 2개면 8자)
  welcomeChars: 120    # [우리] 봇 입장 인사. 덱 24·43: 채팅창 절반 이하
  welcomeLines: 4      # [우리]

mentions:
  perBubble: 15        # [카카오] 덱 32·33: 말풍선 1개당 최대 15명
  maxBubbles: 3        # [카카오] 덱 32·33: 말풍선 3개 연속 = 최대 45명

proactive:
  monthlyMax: 2        # [카카오] 덱 42: 심사 후 월 최대 2회
  maxLines: 2          # [카카오] 덱 42: 1~2줄

# 금지 문구. 띄어쓰기·대소문자를 무시하고 찾아요(「채팅 열람」 = 「채팅열람」).
# 개발(BOT_ENV=dev)에서는 오류로 멈추고, 운영(prod)에서는 응답을 막고 기록만 남겨요.
banned:
  # 덱 40·43·47 공통. 광고 금지(위반 시 챗봇 중단 가능)
  - { phrase: 광고, reason: AD }
  - { phrase: 협찬, reason: AD }
  # 「결제」 같은 구매 유도 금지(이용 횟수 안내는 허용)
  - { phrase: 결제, reason: PURCHASE }
  - { phrase: 구매, reason: PURCHASE }
  - { phrase: 구입, reason: PURCHASE }
  - { phrase: 현금, reason: PURCHASE }
  # 카카오톡 대화를 볼 수 있다고 오해할 표현 금지(「챗봇에게 전달한 명령어」는 허용)
  - { phrase: 대화내용, reason: MISLEADING }
  - { phrase: 채팅내용, reason: MISLEADING }
  - { phrase: 채팅열람, reason: MISLEADING }
  - { phrase: 대화열람, reason: MISLEADING }
  - { phrase: 학습, reason: MISLEADING }
  - { phrase: 대화이력, reason: MISLEADING }
  - { phrase: 대화기록, reason: MISLEADING }
  # 사행성으로 보일 수 있는 표현. 근거는 입점 미팅 개인 후기 1건뿐(카카오 문서로 확인 안 됨, docs/group-bot/open-questions.md)
  - { phrase: 뽑기, reason: GAMBLING }
  - { phrase: 가챠, reason: GAMBLING }
  - { phrase: 도박, reason: GAMBLING }
  - { phrase: 베팅, reason: GAMBLING }
  - { phrase: 배팅, reason: GAMBLING }
  - { phrase: 복권, reason: GAMBLING }
  - { phrase: 슬롯, reason: GAMBLING }
  - { phrase: 잭팟, reason: GAMBLING }
  - { phrase: 카지노, reason: GAMBLING }
  # 유해 표현: 목록은 운영하면서 채워요. 아직 비어 있어요(docs/group-bot/open-questions.md).
