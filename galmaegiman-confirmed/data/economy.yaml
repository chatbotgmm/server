# 갈매미맨 v0.3 경제 수치. 근거: design/SYSTEM-SPEC.md
version: ECONOMY_V1

tickets:
  welcome: 30          # 신규 가입 지급
  claim: 10            # 뽑기권 받기 1회
  cooldownHours: 1     # 받은 뒤 다시 받을 수 있을 때까지. 누적 없음

gachas:                # 등급 확률 합계는 100
  LOW:  { label: 하급, cost: 2, weights: { COMMON: 70, UNCOMMON: 30 } }
  MID:  { label: 중급, cost: 3, weights: { UNCOMMON: 70, SPECIAL: 30 } }
  HIGH: { label: 고급, cost: 5, weights: { SPECIAL: 79, RARE: 20, LEGEND: 1 }, pity: { tier: LEGEND, count: 100 } }   # 천장: 100회 안에 전설 확정

exchange:
  snackCost: 150       # 흔함 1마리 (최상위 유닛 없어도 가능, v0.7.0)
  uncommonCost: 350    # 안흔함 1마리 = 흔함 환산 평균 2.27마리(25/11) × 150 ≈ 341 → 350

shop:                  # 상점 (새우깡 사용처)
  tickets: { snacks: 1000, amount: 10 }   # 뽑기권 1장 ≈ 하급 기대가치 흔함 0.69마리 × 150 ≈ 104 → 장당 100
  expeditionSkip: { snacks: 100 }          # 진행 중인 탐험 바로 귀환

expedition:
  minutes: 60
  snackPerUnit: 10
  maxParty: 10
  levels: [2, 4]       # 같은 시너지 2마리+ = 1단계, 4마리+ = 2단계 (중복 포함)
  effects:
    BASIC:   { label: 기본,   concept: 수호,       snackPercent: [15, 30] }
    GOLD:    { label: 황금,   concept: 금고,       doublePercent: [15, 30] }
    DARK:    { label: 암흑,   concept: 밤,         minutes: [50, 40] }
    SEA:     { label: 바다,   concept: 해저앙영,   commonPercent: [10, 20] }
    BLOSSOM: { label: 벚꽃,   concept: 개화,       uncommonPercent: [5, 10] }
    COSMOS:  { label: 우주,   concept: 별,         ticketPercent: [15, 30] }
    OUTFIT:  { label: 갈 의복, concept: 튼튼한 빤스, snackPerUnit: [2, 4] }
  countBonusPercent: { 2: 5, 3: 10, 4: 15, 5: 25 }   # 같은 유닛 여러 마리, 가장 많은 유닛 기준

rewards:               # 획득 보상 새우깡 (첫 도감 / 중복)
  COMMON:    { first: 0,    duplicate: 0 }
  UNCOMMON:  { first: 50,   duplicate: 10 }
  SPECIAL:   { first: 100,  duplicate: 20 }
  RARE:      { first: 200,  duplicate: 40 }
  LEGEND:    { first: 400,  duplicate: 80 }
  HIDDEN:    { first: 400,  duplicate: 80 }
  LIMITED:   { first: 800,  duplicate: 160 }
  TRANSCEND: { first: 1000, duplicate: 200 }
  ETERNAL:   { first: 1200, duplicate: 240 }
  IMMORTAL:  { first: 1400, duplicate: 280 }

achievements:          # 등급 도감을 처음 모두 채우면 1회 지급 + 칭호
  COMMON:    { tickets: 5,  title: 바닷가 산책자 }
  UNCOMMON:  { tickets: 10, title: 항구 단골 }
  SPECIAL:   { tickets: 15, title: 부두의 수집가 }
  RARE:      { tickets: 20, title: 등대지기 }
  LEGEND:    { tickets: 30, title: 전설 사냥꾼 }
  HIDDEN:    { tickets: 30, title: 비밀을 아는 자 }
  LIMITED:   { tickets: 30, title: 원형의 계승자 }
  TRANSCEND: { tickets: 30, title: 경계를 넘은 자 }
  ETERNAL:   { tickets: 30, title: 시간 밖의 수호자 }
  IMMORTAL:  { tickets: 30, title: 다섯 마리째를 들은 자 }

missions:              # 매일 한국 시간 0시 초기화. 목표 달성 시 자동 지급
  - { key: DRAW,         label: 뽑기 5회,              goal: 5, tickets: 20 }
  - { key: CRAFT,        label: 조합 3회,              goal: 3, tickets: 20 }
  - { key: CRAFT_RARE,   label: 희귀 조합하기,         goal: 1, tickets: 30 }
  - { key: CRAFT_LEGEND, label: 전설 또는 히든 조합하기, goal: 1, tickets: 50 }
  - { key: CRAFT_TOP,    label: 최상위 유닛 조합하기,   goal: 1, tickets: 100 }  # 제한·초월·영원·불멸
  - { key: EXPEDITION,   label: 탐험 다녀오기 1회,      goal: 1, tickets: 10 }   # 탐험 보상 받기 기준
