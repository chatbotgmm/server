# 스토리 모드 — 대사·순서·상대 레벨. 이 파일만 고치면 바뀌어요(검사: npm run data:check)
# 줄거리 근거: design/STORY-BIBLE.md (프롤로그 · 1부 「먹물 이력서」)
#
# who(말하는 이): N = 해설, ME = 내 선두 갈매미(이름이 자동으로 들어감), V1 같은 번호 = 그 빌런(battle.yaml villains),
#                 그 밖의 글자는 그 이름 그대로 보여 줘요(예: 마을 회관 방송)
# enemy: 상대 팀 1~3마리 { id: 빌런 번호, level: 레벨 }. 첫 번째가 먼저 나와요
# scene: 대사 화면 배경 — harbor 항구(맑음) / ink 먹물 항구 / deep 바다 밑 동굴 / hall 마을 회관
# hint: 대결 전에 보여 주는 한 줄 도움말 / lose: 졌을 때 대사(없으면 기본 문구)
# 밸런스 확인: npx tsx scripts/story-balance.ts
# 톤: 위기도 직장인 개그로. 진지한 장면 끝엔 허술한 한 줄. 이기면 처벌하지 않고 채용·계약.
#     '땅콩'은 끝까지 '땅콩'으로만 말해요.

version: STORY_V1
start: { level: 5 }        # 시험판에서 갈매미가 처음 시작하는 레벨

chapters:
  - id: P
    title: "프롤로그 · 빈 자리"
    stages:
      - id: P-1
        title: "첫 출근"
        scene: harbor
        before:
          - { who: N, say: "큰 태풍이 지나가고, 갈매미 섬 수비대가 다시 일어났어요." }
          - { who: N, say: "그런데 수비대장 자리가 비어 있어요. 마을 회관은 승진 심사로 새 수비대장을 뽑기로 했어요." }
          - { who: 마을 회관 방송, say: "신입 수비조장님, 첫 출근을 환영합니다. 출근 도장부터 찍어 주세요." }
          - { who: ME, say: "(쾅!) 오늘부터 수비조장이에요!" }
          - { who: N, say: "그때 부서진 보관소 쪽에서 바스락, 새우gang 봉지 소리가 들려요." }
          - { who: V12, say: "끼룩! 이 땅콩 부스러기, 주인 없지? 그럼 내 거!" }
          - { who: ME, say: "그건 보관소 거예요. 돌려주세요!" }
        hint: "기술 3개 중 하나를 골라요. 상대 속성에 강한 공격은 1.5배예요. 시작할 때 고르는 증강체로 상성을 뒤집을 수도 있어요."
        enemy:
          - { id: V12, level: 4 }
        after:
          - { who: V12, say: "끼룩… 신입이 이렇게 셀 줄이야. 새우gang이나 먹으러 가야지." }
          - { who: N, say: "끼룩단 졸개가 떨어뜨리고 간 땅콩 부스러기를 주웠어요." }
          - { who: 마을 회관 방송, say: "보관소가… 부서져 있다고요? 회의 안건 1번 「땅콩, 어디에 쓰지?」를 긴급 안건으로 올립니다." }
          - { who: N, say: "첫 출근부터 일이 커졌어요." }

  - id: "1"
    title: "1부 · 먹물 이력서"
    intro: "항구가 먹물로 뒤덮였어요. 해저 2층에서 올라온 쭈매미 수천 마리가 입사 지원서를 들이밀어요."
    stages:
      - id: 1-1
        title: "항구의 먹물"
        scene: ink
        before:
          - { who: N, say: "다음 날 아침, 항구가 시커매요." }
          - { who: V1, say: "안녕하세요! 저희도 갈매미예요! 입사 지원하러 왔어요!" }
          - { who: ME, say: "…머리에 붙인 볏, 종이로 만든 거죠?" }
          - { who: V1, say: "아, 아니에요! 진짜 볏이에요!" }
          - { who: N, say: "바람이 불자 볏이 훌렁 날아가요." }
          - { who: V1, say: "…면접 보러 왔으니 실력부터 보여 드릴게요!" }
        hint: "쭈매미는 대부분 바다 속성이에요. 바다에 강한 건 얼음과 별이에요."
        enemy:
          - { id: V1, level: 6 }
          - { id: V1, level: 6 }
        after:
          - { who: V1, say: "불합격이에요…? 다음 공채는 언제예요?" }
          - { who: N, say: "쭈매미가 떨어뜨린 지원서를 펼쳐 보니 먹물 얼룩뿐이에요. 그런데 얼룩 사이에서 땅콩 냄새가 나요." }

      - id: 1-2
        title: "이력서 폭탄"
        scene: ink
        before:
          - { who: N, say: "항구 우체통이 터지기 직전이에요. 먹물 이력서가 끝없이 들어와요." }
          - { who: V2, say: "이력서 3만 장 접수 완료! 하나는 붙겠지!" }
          - { who: ME, say: "자기소개란이 전부 먹물이잖아요." }
          - { who: V2, say: "그게 저희 스펙이에요. 먹물 다루기 경력 30년!" }
          - { who: ME, say: "쭈꾸미는 그렇게 오래 못 살지 않아요?" }
          - { who: V2, say: "…경력은 원래 좀 부풀리는 거예요!" }
        hint: "먹물 쭈매미는 그림자 속성이에요. 그림자에 강한 건 꽃과 별이에요."
        enemy:
          - { id: V2, level: 8 }
          - { id: V1, level: 7 }
        after:
          - { who: V2, say: "서류 탈락이라니…" }
          - { who: N, say: "이력서 더미 밑에서 땅콩 부스러기가 또 나왔어요. 쭈매미들이 이걸 먹고 기세가 붙은 것 같아요." }

      - id: 1-3
        title: "출근 도장대 사수"
        scene: harbor
        before:
          - { who: N, say: "수비대 출근 도장대에 빨판이 철썩 붙어 있어요." }
          - { who: V3, say: "도장 찍기 전엔 안 놔요! 출근 도장은 직원의 상징이니까요!" }
          - { who: ME, say: "그 도장대가 있어야 저희가 출근을 하는데요." }
          - { who: V3, say: "그러니까 같이 출근해요! 영원히!" }
        hint: "빨판 쭈매미는 상대를 묶어서 교체를 막아요. 묶이기 전에 바꿀 갈매미를 정해 두세요."
        enemy:
          - { id: V3, level: 9 }
          - { id: V1, level: 9 }
          - { id: V2, level: 9 }
        after:
          - { who: V3, say: "빨판이… 퉁퉁 불었어요…" }
          - { who: N, say: "갈매미 하나, 둘, 셋. 수비조 모두 무사히 출근 도장을 찍었어요." }

      - id: 1-4
        title: "해저 2층 입구"
        scene: deep
        before:
          - { who: N, say: "쭈매미들이 올라온 길을 따라가니 바다 밑 동굴이 나와요. 입구에 「해저 2층」 조개 간판이 걸려 있어요." }
          - { who: N, say: "그 앞을 반투명한 알 무더기가 막고 있어요. 알마다 작은 종이 볏이 붙어 있어요." }
          - { who: V4, say: "(꼼지락꼼지락) …지원… 예정…" }
          - { who: ME, say: "아직 태어나지도 않았는데 벌써 지원 예정이에요?" }
          - { who: V2, say: "요즘은 알 때부터 준비해야 해요!" }
        hint: "알 무더기는 스스로 회복하고 피해를 줄여요. 위력 높은 기술로 한 번에 몰아붙여 보세요."
        enemy:
          - { id: V4, level: 11 }
          - { id: V2, level: 10 }
          - { id: V3, level: 10 }
        after:
          - { who: N, say: "알 무더기가 데굴데굴 굴러 길을 비켜 줘요." }
          - { who: N, say: "동굴 안쪽에서 굵은 목소리가 울려요. 「이력서는 여덟 장씩 내라고 했지!」" }

      - id: 1-5
        title: "여덟발 대장"
        scene: deep
        before:
          - { who: V5, say: "여기까지 왔나, 수비조장! 나는 쭈매미 취업 준비단 단장, 여덟발 대장이다!" }
          - { who: V5, say: "다리 여덟 개에 이력서 여덟 장. 너희는 손이 두 개뿐이지?" }
          - { who: ME, say: "저희는 날개예요." }
          - { who: V5, say: "…그럼 이력서를 아예 못 쓰겠군. 불쌍하게도!" }
          - { who: V5, say: "바다에 떨어진 땅콩을 먹고 우린 깨달았다. 우리도 출근하고 싶다! 들이받고 싶다!" }
        hint: "여덟발 대장의 「이력서 여덟 장」은 여러 번 때려요. 받는 피해를 줄이는 기술이 잘 통해요."
        enemy:
          - { id: V5, level: 11 }
          - { id: V1, level: 10 }
          - { id: V2, level: 10 }
        after:
          - { who: V5, say: "크윽… 다리가 엉켰다…" }
          - { who: V5, say: "하지만 늦었다. 쭈매미 전원이 같은 자리에 지원했거든. 자리는 하나, 지원자는 천 마리!" }
          - { who: N, say: "동굴 전체가 흔들려요. 바다 밑에서 거대한 무언가가 솟아올라요." }

      - id: 1-6
        title: "쭈라켄"
        scene: deep
        before:
          - { who: N, say: "수천 마리 쭈매미가 다리를 꼬아 하나로 뭉쳤어요. 머리에는 거대한 종이 볏이 얹혀 있어요." }
          - { who: V6, say: "자리는! 하나! 지원자는! 천 마리!" }
          - { who: ME, say: "수비대의 같은 자리 발령 합체를 따라 한 거예요?!" }
          - { who: V6, say: "수비대가 하는 건 우리도 한다! 우리도 갈매미다!" }
          - { who: N, say: "쭈라켄 한가운데에서 땅콩 빛이 번쩍여요. 가라앉은 땅콩이 저기 있어요." }
        hint: "쭈라켄은 체력이 아주 많아요. 증강체와 교체를 아끼지 말고, 별·얼음 속성으로 공략해 보세요."
        enemy:
          - { id: V6, level: 13 }
        after:
          - { who: N, say: "쭈라켄이 풀리면서 쭈매미 천 마리가 데굴데굴 흩어져요. 한가운데서 가라앉았던 땅콩이 떠올라요." }
          - { who: V5, say: "기, 기세가 빠지니까… 갑자기 무섭네요… 저희 이제 어떡하죠…" }
          - { who: ME, say: "해저 2층 청소 계약직, 어때요? 먹물 닦는 건 여러분이 제일 잘하잖아요." }
          - { who: V5, say: "…정규직 전환도 되나요?" }
          - { who: ME, say: "열심히 하면요." }
          - { who: N, say: "쭈매미 천 마리가 한꺼번에 출근 도장을 찍어요. 도장대가 조금 찌그러졌어요." }
    clear:
      - { who: 마을 회관 방송, say: "수비조장님, 첫 실적 축하드립니다. 1단계 승진 심사가 열렸습니다." }
      - { who: N, say: "쭈매미 장부 마지막 장에 이렇게 적혀 있어요. 「남은 땅콩은 해협 쪽으로 떠내려갔음.」" }
      - { who: N, say: "1부 끝. 2부 「인수합병 소용돌이」로 이어져요." }

  - id: "2"
    title: "2부 · 인수합병 소용돌이"
    needStage: 1         # 팀 전원 1단계 승진해야 들어감
    intro: "남은 땅콩은 해협으로 떠내려갔어요. 해협에 「랍매미 해운」이 생기더니, 금빛 시장 상점들이 하나둘 랍매미에게 넘어가요."
    stages:
      - id: 2-1
        title: "통행료"
        scene: strait
        before:
          - { who: N, say: "해협 한가운데 바위섬에 붉은 집게 모양 관문이 생겼어요." }
          - { who: V7, say: "랍매미 해운입니다! 이 뱃길은 이제 저희 거예요. 통행료는 새우gang 두 봉지!" }
          - { who: ME, say: "어제까지 공짜였잖아요." }
          - { who: V7, say: "어제까지는 저희가 없었으니까요!" }
          - { who: V7, say: "안 내시면 집게로 끈을 똑! 잘라 드립니다. 배 묶는 끈, 신발 끈, 앞치마 끈 전부요." }
        hint: "랍매미는 속성이 제각각이에요. 상대 이름 옆 속성을 보고 ▲유리한 기술을 골라요."
        enemy:
          - { id: V7, level: 24 }
          - { id: V7, level: 23 }
        after:
          - { who: V7, say: "통행료 면제… 해 드릴게요… 이번만…" }
          - { who: N, say: "랍매미가 떨어뜨린 명함에 이렇게 적혀 있어요. 「랍매미 해운 · 금빛 시장 지점 개업 예정」." }

      - id: 2-2
        title: "금빛 시장 인수"
        scene: market
        before:
          - { who: N, say: "금빛 시장 천막마다 빨간 집게 표식이 붙어 있어요. 이미 랍매미에게 넘어간 가게들이에요." }
          - { who: V9, say: "자, 다음 매물! 금빛 시장 3번 천막, 시작가 새우gang 열 봉지!" }
          - { who: D2, say: "…그만. 그 장부, 나도 좀 보자." }
          - { who: N, say: "원금 갈매미맨이에요. 예전에는 「갈노스」라고 불리던, 금고에 스스로 갇혔다가 다시 태어난 갈매미예요." }
          - { who: D2, say: "싸게 사서 크게 부풀리고, 남의 가게를 내 이름으로 바꾸고… 이 녀석들, 내가 예전에 하던 짓을 똑같이 하고 있어." }
          - { who: ME, say: "그럼 어떻게 막아야 하는지도 아시겠네요." }
          - { who: D2, say: "알지. 내가 당해 봤으니까. 일단 경매봉부터 뺏어." }
        hint: "랍매미 경매사는 상대 공격을 깎아요. 공격이 약해지면 교체하거나 강화 기술로 되돌려요."
        enemy:
          - { id: V9, level: 24 }
          - { id: V7, level: 24 }
          - { id: V7, level: 23 }
        after:
          - { who: V9, say: "유찰! 유찰입니다아…" }
          - { who: D2, say: "장부를 보니 바스락상회까지 매물로 올려놨네. 서둘러." }

      - id: 2-3
        title: "바스락상회 매물"
        scene: market
        before:
          - { who: N, say: "섬에서 제일 오래된 새우gang 가게, 바스락상회 앞에 「매물」 딱지가 붙었어요." }
          - { who: N, say: "봉지를 흔들면 바스락. 섬 갈매미라면 다 아는 그 소리가 오늘은 조용해요." }
          - { who: V8, say: "껍데기를 몇 번 벗었는지 알아? 아홉 번이야. 이 가게도 껍데기만 남기고 우리 거로 만들 거야." }
          - { who: ME, say: "가게는 껍데기가 아니에요. 단골이 있어요." }
          - { who: V8, say: "단골도 인수하면 되지!" }
        hint: "껍데기 랍매미는 허물을 벗으며 체력을 회복하고 방어를 올려요. 「기세 빼앗기」처럼 강화를 지우는 기술이 잘 통해요."
        enemy:
          - { id: V8, level: 24 }
          - { id: V9, level: 24 }
          - { id: V7, level: 23 }
        after:
          - { who: N, say: "「매물」 딱지가 떨어지자, 가게 안에서 바스락 소리가 다시 들려요." }
          - { who: V8, say: "…새우gang 한 봉지만 사도 돼요?" }
          - { who: N, say: "그런데 시장 끝 빨래터 쪽에서 비명이 들려요. 빨랫줄이 하나도 남김없이 잘려 나갔대요." }

      - id: 2-4
        title: "빨래터 습격"
        scene: laundry
        before:
          - { who: N, say: "빨래터 언덕에 빨랫줄이 모두 잘려 있고, 이불 홑청과 앞치마가 바람에 날려요." }
          - { who: V7, say: "선장님 명령이에요! 돛이 모자라서요!" }
          - { who: ME, say: "남의 빨래로 돛을 만들면 안 돼요." }
          - { who: V9, say: "그래서 저희가 정당하게 인수했죠. 한 장에 새우gang 반 개!" }
        hint: "같은 시너지 갈매미 2마리를 팀에 넣으면 합동기를 쓸 수 있어요. 어려운 판에서 큰 힘이 돼요."
        enemy:
          - { id: V7, level: 25 }
          - { id: V9, level: 25 }
          - { id: V7, level: 24 }
        after:
          - { who: N, say: "빨래를 되찾았지만, 커다란 앞치마 열두 장은 이미 배에 실려 갔어요." }
          - { who: N, say: "언덕 아래, 빨래 돛을 단 배 한 척이 해협으로 미끄러져 가요. 뱃머리에 커다란 집게가 서 있어요." }

      - id: 2-5
        title: "대집게 선장"
        scene: strait
        before:
          - { who: V10, say: "어이, 수비조장! 빨래 돛 멋지지? 바람을 아주 잘 받아." }
          - { who: ME, say: "앞치마에 「바스락상회」라고 적혀 있는데요." }
          - { who: V10, say: "이제 「랍매미 해운」이야. 인수했거든." }
          - { who: V10, say: "해협의 땅콩을 먹은 뒤로 깨달았지. 바다는 넓고, 내 집게는 더 넓다!" }
          - { who: D2, say: "조심해. 저 녀석은 빠르게 들이받고 빠지는 타입이야. 먼저 때리는 기술이 있으면 써." }
        hint: "대집게 선장은 돌격하면서 속도가 올라요. 「재빠른 쪼기」처럼 무조건 먼저 쓰는 기술이 쓸모 있어요."
        enemy:
          - { id: V10, level: 26 }
          - { id: V8, level: 25 }
          - { id: V7, level: 25 }
        after:
          - { who: V10, say: "돛이… 앞치마가 바람에 뒤집혔다…" }
          - { who: V10, say: "하지만 늦었어. 회사들이 서로를 계속 인수하더니, 해협 한가운데가 돌기 시작했거든." }
          - { who: N, say: "바다가 빙글빙글 돌아요. 닿는 건 뭐든 빨려 들어가요." }

      - id: 2-6
        title: "카랍디스"
        scene: strait
        before:
          - { who: N, say: "랍매미 회사들이 인수하고, 또 인수하고, 또 인수하다가 해협 한가운데에서 거대한 소용돌이가 됐어요." }
          - { who: V11, say: "모든 것은! 자회사가 된다!" }
          - { who: N, say: "부표, 그물, 갈매기 깃털, 새우gang 봉지까지 소용돌이 속으로 빨려 들어가요." }
          - { who: D2, say: "끝까지 삼키다 보면 결국 자기 자신까지 삼켜. 내가 그랬어. 금고 안에서." }
          - { who: ME, say: "그럼 멈추게 해 줘야겠네요. 삼키기 전에." }
        hint: "카랍디스는 강화를 지우고 스스로 회복해요. 체력이 많으니 증강체·합동기·교체를 아끼지 말아요."
        enemy:
          - { id: V11, level: 28 }
        after:
          - { who: N, say: "소용돌이가 천천히 멎어요. 바다 밑에 가라앉아 있던 땅콩이 떠올라요." }
          - { who: V10, say: "기세가 빠지니까… 회사를 이렇게 많이 갖고 있을 이유가 없네요." }
          - { who: V10, say: "통행료는 없애겠습니다. 대신… 뱃길 안내는 저희가 해 드려도 될까요? 해협은 저희가 제일 잘 알아요." }
          - { who: ME, say: "좋아요. 뱃길 안내 협력업체로 계약해요." }
          - { who: N, say: "바스락상회 앞치마 열두 장도 깨끗하게 빨아서 돌아왔어요. 출근 도장대 옆에 새 도장이 하나 늘었어요. 「랍매미 해운 · 협력업체」." }
    clear:
      - { who: 마을 회관 방송, say: "수비조장님, 해협 실적 확인했습니다. 2단계 승진 심사가 열렸습니다." }
      - { who: N, say: "랍매미 장부의 마지막 줄. 「가장 큰 땅콩 덩어리 — 끼룩단이 먼저 가져감.」" }
      - { who: D2, say: "끼룩단은 원래 새우gang 도둑이었어. 그런데 깃털이 까매진 건… 나도 처음 봐." }
      - { who: N, say: "2부 끝. 3부 「검은 깃털」로 이어져요." }

  - id: "3"
    title: "3부 · 검은 깃털"
    needStage: 2         # 팀 전원 2단계 승진해야 들어감
    intro: "끼룩단의 깃털이 까맣게 물들었어요. 섬 하늘을 날며, 땅콩을 뗀 갈매미맨들에게 땅콩을 억지로 먹여요."
    stages:
      - id: 3-1
        title: "검은 하늘"
        scene: sky
        before:
          - { who: N, say: "아침 하늘이 까맣게 덮였어요. 까만 깃털의 끼룩단이 섬 위를 빙빙 돌아요." }
          - { who: V19, say: "끼룩! 너희 갈매미맨들, 땅콩 뗐다며? 돌려줄게. 공짜로!" }
          - { who: N, say: "땅콩을 억지로 먹은 수비대원들이 기세가 넘쳐 사방에 들이받기 시작해요. 출근 도장대가 벌써 두 번 넘어졌어요." }
          - { who: N1, say: "…저한테는 안 붙네요. 붙을 자리가 없으니까요." }
          - { who: D7, say: "나도 멀쩡해. 폭주한 애들은 우리가 붙잡을게. 조장은 저 까만 녀석들을 막아!" }
        hint: "끼룩단은 「땅콩 폭주」를 걸어요(공격 ↑, 방어 ↓). 이름에 「갈매미맨」이 있는 갈매미만 걸리고, 갈크탑처럼 이름에 없는 원형은 걸리지 않아요."
        enemy:
          - { id: V19, level: 40 }
          - { id: V19, level: 39 }
          - { id: V19, level: 39 }
        after:
          - { who: V19, say: "끼룩… 왜 안 먹는 애들이 있는 거야…" }
          - { who: N, say: "까만 깃털이 날아간 쪽, 구름 위에 바위 섬이 떠 있어요. 거기서 급강하 소리가 들려요." }

      - id: 3-2
        title: "급강하"
        scene: sky
        before:
          - { who: V13, say: "고글 착용! 각도 확인! 급강하!" }
          - { who: ME, say: "위에서 오는 건 못 피해요!" }
          - { who: D7, say: "피하지 말고 버텨. 내 배를 봐. 내놓고도 잘만 버티잖아." }
          - { who: V13, say: "날 수 있는 우리가 더 위야! 못 나는 직장인들은 아래에서 출근이나 해!" }
        hint: "급강하 대원의 「내리꽂기」는 무조건 먼저 맞아요. 받는 피해를 줄이는 기술로 버티고 반격해요."
        enemy:
          - { id: V13, level: 40 }
          - { id: V19, level: 39 }
          - { id: V13, level: 39 }
        after:
          - { who: V13, say: "고글에… 김이 서렸어…" }
          - { who: N, say: "바위 섬 끝에서 무언가 반짝여요. 누군가 이쪽을 겨누고 있어요." }

      - id: 3-3
        title: "깃털 저격"
        scene: sky
        before:
          - { who: V14, say: "움직이지 마. 한쪽 눈을 감으면 다 맞힐 수 있어." }
          - { who: N1, say: "저 깃털, 원래는 하얬을 거예요. 끝에 흰 부분이 조금 남아 있어요." }
          - { who: V14, say: "…그런 건 보지 마." }
        hint: "깃털 저격수의 「깃털 저격」은 반드시 급소예요. 막기 기술이나 「철벽」 증강체로 대비해요."
        enemy:
          - { id: V14, level: 40 }
          - { id: V13, level: 39 }
          - { id: V19, level: 39 }
        after:
          - { who: V14, say: "…빗나갔다. 처음이야." }
          - { who: N, say: "구름이 걷히고, 끼룩단 섬이 보여요. 섬 한가운데가 금빛으로 갈라져 빛나요. 땅콩 모양으로." }

      - id: 3-4
        title: "끼룩단 섬 상륙"
        scene: nest
        before:
          - { who: N, say: "검은 돌로 된 둥지 같은 광장. 바닥 곳곳에 새우gang 봉지 더미가 쌓여 있어요." }
          - { who: V16, say: "여기부터는 정예만 지나간다. 너희는 못 지나가." }
          - { who: D7, say: "갈매미 하나, 둘, 셋. 다 왔어. 폭주한 애들은 뒤에서 잡고 있어." }
          - { who: V16, say: "땅콩은 다 줬는데… 왜 너희는 아직 순하지?" }
          - { who: ME, say: "순한 게 아니라, 이번엔 우리가 정한 거예요." }
        hint: "검은 깃털 정예는 공격을 깎고 땅콩 폭주까지 걸어요. 폭주에 안 걸리는 원형을 앞에 세워 보세요."
        enemy:
          - { id: V16, level: 40 }
          - { id: V16, level: 39 }
          - { id: V14, level: 39 }
        after:
          - { who: V16, say: "깃털이… 끝부터 하얘지고 있어…" }
          - { who: N, say: "광장 안쪽에서 날갯짓 한 번에 바람이 몰아쳐요. 덩치 큰 까만 갈매기가 금메달을 흔들어요." }

      - id: 3-5
        title: "끼룩단 행동대장"
        scene: nest
        before:
          - { who: V15, say: "나는 땅콩을 제일 많이 먹은 끼룩단 행동대장이다! 이 메달이 그 증거지!" }
          - { who: ME, say: "그건 많이 먹었다는 증거지, 잘했다는 증거는 아니에요." }
          - { who: V15, say: "…시끄럽다! 날갯짓 한 번이면 끝이다!" }
          - { who: N1, say: "저 기세는 원래 저 갈매기 것이 아니에요. 다른 누군가가 떼어 낸 거예요." }
        hint: "행동대장은 돌진할 때마다 공격이 올라요. 오래 끌수록 위험하니 강한 기술을 먼저 써요."
        enemy:
          - { id: V15, level: 42 }
          - { id: V16, level: 40 }
          - { id: V13, level: 40 }
        after:
          - { who: V15, say: "메달이… 무거워서… 못 날겠다…" }
          - { who: N, say: "광장 한가운데, 금빛 균열 위에 누군가 서 있어요. 갈매미맨을 꼭 닮았지만, 온몸이 검은 돌이에요." }

      - id: 3-6
        title: "블랙 갈매미맨"
        scene: nest
        before:
          - { who: V17, say: "왔구나, 수비조장." }
          - { who: V17, say: "너희가 버린 걸 내가 주웠을 뿐이야. 이 섬에서 진짜 갈매미맨은 나 하나야." }
          - { who: ME, say: "당신은… 누구예요?" }
          - { who: V17, say: "보관소에 쌓여 있던 기세. 허세, 들이받는 성질, 서열 다툼. 너희가 순한 직원이 되려고 떼어 낸 것들." }
          - { who: V17, say: "네가 뗀 땅콩도 여기 있어." }
          - { who: N, say: "그의 몸 곳곳에서 땅콩 모양 빛이 깜빡여요. 하나, 둘, 셋… 셀 수가 없어요." }
          - { who: V17, say: "전부 돌려줄게. 모두가 다시 진짜 갈매미맨이 되는 거야." }
          - { who: N1, say: "그러면 다들 폭주해요. 지금 섬처럼요." }
          - { who: V17, say: "…그럼 버린 채로 두는 게 맞다는 거냐?" }
        hint: "블랙 갈매미맨은 3단계예요. 1단계 그림자, 2단계는 내 팀에 가장 많은 속성을 그대로 복사, 3단계는 쓰러질 듯해도 다시 붙어요. 속성이 다양한 팀이 유리해요."
        enemy:
          - { id: V17, level: 44 }
          - { id: V21, level: 44 }
          - { id: V22, level: 45 }
        after:
          - { who: N, say: "블랙 갈매미맨이 무릎을 꿇어요. 그런데 쓰러지지 않아요. 몸 곳곳의 땅콩이 계속 그를 다시 붙여요." }
          - { who: V22, say: "힘으로는 안 끝나. 버린 게 사라지는 건 아니니까." }
          - { who: ME, say: "…맞아요. 버리는 것도, 억지로 먹이는 것도 답이 아니었어요." }
          - { who: ME, say: "제 몫은 제가 다시 맡을게요. 남한테 떠넘기지도, 버리지도 않고." }
          - { who: N, say: "수비조의 갈매미맨들이 하나씩 앞으로 나와요. 그 길을 갈크탑과 중성 갈매미가 끝까지 지켜 줘요." }
          - { who: N, say: "갈매미 하나, 둘, 셋, 넷… 각자 자기 땅콩을 찾아갈 때마다 블랙 갈매미맨이 조금씩 작아져요." }
          - { who: N, say: "마지막에 남은 건, 아무도 찾아가지 않은 땅콩 한 알." }
          - { who: V22, say: "…이건 누구 거야?" }
          - { who: N1, say: "당신 거예요. 처음부터." }
          - { who: N, say: "블랙 갈매미맨은 사라지지 않았어요. 평범한 크기의 갈매미맨이 되었어요. 깃털 끝이 조금 까만, 이름 없는 갈매미맨이요." }
          - { who: N, say: "끼룩단의 깃털이 끝에서부터 다시 하얘져요. 새우gang 봉지 더미 위로 바스락, 바람이 지나가요." }
    clear:
      - { who: 마을 회관 방송, say: "수비조장님, 마지막 실적 확인했습니다. 3단계 승진 심사가 열렸습니다. 그리고… 회의를 다시 열겠습니다." }
      - { who: N, say: "에필로그 · 회의 끝. 마을 회관 회의가 드디어 끝나요. 안건 1번 「땅콩, 어디에 쓰지?」" }
      - { who: 마을 회관 방송, say: "결론. 땅콩은 떼어 버리지도, 억지로 먹이지도 않는다. 주인이 책임지고 보관소에 맡겨 두고, 기세가 필요할 때만 꺼내 쓴다." }
      - { who: D2, say: "그럼 첫 쓰임새는 정해졌네. 낯선 곳에 가서 「같이 일하자」고 말하는 데는 기세가 꽤 필요하거든." }
      - { who: N, say: "그렇게 「외근」이 생겼어요. 땅콩을 조금 꺼내 들고, 다른 갈매미를 데려오러 가는 일이에요." }
      - { who: 마을 회관 방송, say: "수비대장 자리는 한 번 뽑고 끝내지 않겠습니다. 시즌마다 승진 심사 대결로 뽑겠습니다." }
      - { who: N, say: "출근 도장대 앞에 줄이 섰어요. 쭈매미, 랍매미, 하얀 깃털 끼룩단, 그리고 깃털 끝이 조금 까만 신입 하나." }
      - { who: V20, say: "끼룩. 오늘부터 하늘 배달 담당입니다. 새우gang은… 이제 사 먹을게요." }
      - { who: N, say: "신입이 도장을 쾅 찍어요. 그 땅콩이 살짝 반짝여요. 끝." }
