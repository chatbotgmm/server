  OUTFIT:  { name: 갈 의복 시너지, members: [D7, D8, T7, T8, E7, E8, I7, I8, I9], skill: { name: 튼튼한 빤스 결속, cd: 0, effects: [ { endure: 2 }, { buff: atk, pct: 25, turns: 3, to: team } ] } }

# 레벨업 기술 배우기: levels에 도달할 때마다 1번 기회(후보 offers개 중 1개 또는 건너뛰기). 배운 기술 칸은 slots개(차면 하나와 바꿈)
#   기술마다 level(이 레벨 기회부터 후보에 나옴), roles(그 역할만, 없으면 모두), attr(없으면 배우는 유닛의 속성)
learn:
  levels: [10, 20, 30, 40, 50]
  slots: 2
  offers: 3
  skills:
    quick:    { name: 재빠른 쪼기,   level: 10, cd: 1, power: 40, priority: true }
    peck:     { name: 연속 쪼기,     level: 10, cd: 2, power: 22, hits: 3 }
    sand:     { name: 모래 끼얹기,   level: 10, cd: 2, effects: [ { buff: spd, pct: -30, turns: 3, to: foe } ] }
    growl:    { name: 끼룩 위협,     level: 10, cd: 2, effects: [ { buff: atk, pct: -20, turns: 3, to: foe } ] }
    preen:    { name: 깃털 고르기,   level: 10, cd: 3, roles: [DEFENSE, UTILITY], effects: [ { heal: 25, to: self } ] }
    snack:    { name: 새우깡 미끼,   level: 10, cd: 4, roles: [UTILITY], effects: [ { status: sleep, chance: 60, turns: 1 } ] }
    flame:    { name: 불꽃 부리,     level: 20, attr: FIRE,   cd: 2, power: 55, effects: [ { status: burn, chance: 30, turns: 3 } ] }
    frost:    { name: 얼음 숨결,     level: 20, attr: ICE,    cd: 2, power: 55, effects: [ { status: freeze, chance: 20, turns: 1 } ] }
    wrap:     { name: 실 감기,       level: 20, attr: THREAD, cd: 3, power: 40, effects: [ { status: bind, chance: 100, turns: 2 } ] }
    brace:    { name: 철벽 자세,     level: 20, cd: 4, roles: [DEFENSE], effects: [ { guard: 50, turns: 2 } ] }
    pump:     { name: 기합 넣기,     level: 20, cd: 3, roles: [ATTACK], effects: [ { buff: atk, pct: 30, turns: 3, to: self } ] }
    cheer:    { name: 출근 응원가,   level: 20, cd: 4, roles: [UTILITY], effects: [ { buff: atk, pct: 15, turns: 3, to: team } ] }
    pierce:   { name: 급소 찌르기,   level: 30, cd: 3, power: 70, crit: true, roles: [ATTACK, UTILITY] }
    grit:     { name: 악으로 버티기, level: 30, cd: 5, roles: [DEFENSE, ATTACK], effects: [ { endure: 2 } ] }
    block:    { name: 날개로 막기,   level: 30, cd: 3, effects: [ { protect: true } ] }
    steal:    { name: 기세 빼앗기,   level: 30, cd: 3, power: 50, roles: [UTILITY], effects: [ { strip: true } ] }
    rest:     { name: 휴식 시간,     level: 30, cd: 5, roles: [UTILITY, DEFENSE], effects: [ { regen: 8, turns: 3, to: team } ] }
    ambush:   { name: 그림자 기습,   level: 30, attr: SHADOW, cd: 3, power: 60, priority: true }
    rush:     { name: 전력 돌진,     level: 40, cd: 3, power: 130, roles: [ATTACK], effects: [ { recharge: true } ] }
    meteor:   { name: 별똥 낙하,     level: 40, attr: STAR, cd: 3, power: 80 }
    armor:    { name: 돌 갑옷,       level: 40, cd: 4, roles: [DEFENSE], effects: [ { buff: def, pct: 30, turns: 3, to: team } ] }
    quake:    { name: 땅 울리기,     level: 40, attr: STONE, cd: 3, power: 75, effects: [ { buff: spd, pct: -20, turns: 2, to: foe } ] }
    finisher: { name: 필살 갈매기 낙하, level: 50, cd: 4, power: 160, roles: [ATTACK], effects: [ { recharge: true } ] }
    flag:     { name: 만선 깃발,     level: 50, cd: 5, effects: [ { buff: atk, pct: 20, turns: 3, to: team }, { buff: def, pct: 20, turns: 3, to: team } ] }
    comeback: { name: 다시 출근,     level: 50, cd: 6, roles: [UTILITY, DEFENSE], effects: [ { revive: 40 } ] }
    blizzard: { name: 눈보라,        level: 50, attr: ICE, cd: 4, power: 90, effects: [ { status: freeze, chance: 30, turns: 1 } ] }

# 상태 이상 수치
status: { burnDamage: 6, burnAtk: -20, bindSpd: -30, rageAtk: 30, rageDef: -30 }

# 공통 전투 증강체(전투 시작·전투불가 때 양쪽이 3개 중 1개). 이름과 숫자를 고칠 수 있어요. 효과 종류(코드)는 그대로
battleAugments:
  reverse:    { name: 역상성 }
  weakguard:  { name: 약점 보강 }
  focus:      { name: 집중 공략, value: 1.9 }               # 상성 강할 때 배율
  neutral:    { name: 무속성 지대, turns: 3 }
  camo:       { name: 보호색 }
  dual:       { name: 이중 속성 }
  counter:    { name: 역습 태세, power: 40 }
  learn:      { name: 상성 학습, step: 15, max: 45 }        # 같은 속성에 맞을 때마다 % 감소, 최대
  first:      { name: 출근 도장 }
  bulwark:    { name: 철벽, pct: 40, turns: 2 }
  firstaid:   { name: 응급처치, pct: 25 }
  freeswitch: { name: 인사 발령 }
  lastone:    { name: 마지막 출근, pct: 30 }
  strip:      { name: 기세 꺾기, pct: 20, turns: 2 }
  rustle:     { name: 바스락 }
  peanut:     { name: 땅콩 기세, atk: 30, taken: 15 }       # 갈매미맨만 공격 +, 받는 피해 +

# 성장
growth:
  maxLevel: 60
  evolveLevel: [20, 35, 50]          # 1·2·3단계 진화 레벨(스토리 1·2·3부 클리어도 필요)
  stageMult: [1, 1.12, 1.25, 1.4]    # 원형·1·2·3단계 능력치 배율
  levelGrowth: 4                     # 레벨 1당 능력치 +%
  xpBase: 20                         # 다음 레벨 경험치 = xpBase × 레벨^xpExp
  xpExp: 1.5
  winXp: 60                          # 이기면 60 × 상대 평균 레벨
  loseXp: 20

# 진화 증강체(직무 표창): 진화할 때 역할에 맞는 것 중 3개 제안, 1개 선택. roles: ANY 는 모든 역할
evoAugments:
  pierce:    { name: 관통 표창,       roles: [ATTACK],            pierce: 25 }
  execute:   { name: 마무리 표창,     roles: [ATTACK],            execute: 40 }
  crit:      { name: 급소 표창,       roles: [ATTACK],            critPlus: 15 }
  opener:    { name: 선봉 표창,       roles: [ATTACK],            opener: 50 }
  lifesteal: { name: 야근 식대 표창,  roles: [ATTACK],            lifesteal: 20 }
  reflect:   { name: 반사 표창,       roles: [DEFENSE],           reflect: 20 }
  cut:       { name: 철갑 표창,       roles: [DEFENSE],           cut: 12 }
  regen:     { name: 근속 표창,       roles: [DEFENSE],           regen: 5 }
  laststand: { name: 불굴 표창,       roles: [DEFENSE],           lastStand: true }
  resist:    { name: 정신력 표창,     roles: [DEFENSE, UTILITY],  statusResist: 50 }
  status:    { name: 전문가 표창,     roles: [UTILITY],           statusPlus: 20 }
  duration:  { name: 꼼꼼 표창,       roles: [UTILITY],           durationPlus: 1 }
  sigcd:     { name: 능률 표창,       roles: [UTILITY, ATTACK],   sigCd: 1 }
  handoff:   { name: 인수인계 표창,   roles: [UTILITY, DEFENSE],  handoff: 15 }
  hp:        { name: 체력 표창,       roles: ANY,                 hpPct: 12 }
  atk:       { name: 힘 표창,         roles: ANY,                 atkPct: 10 }
  def:       { name: 맷집 표창,       roles: ANY,                 defPct: 10 }
  spd:       { name: 출근 속도 표창,  roles: ANY,                 spdPct: 10 }

# 외근(스카우트). 근거·기대값 표: design/BATTLE-SYSTEM.md
scout:
  freeOutingsPerDay: 3
  extraOutingPeanut: 1
  maxExtraPerDay: 10
  levelBand: 3                                                   # 기준 레벨 ±
  encounter:   { LIMITED: 45, TRANSCEND: 30, ETERNAL: 17, IMMORTAL: 8 }   # 만나는 등급 비율(%)
  base:        { LIMITED: 35, TRANSCEND: 22, ETERNAL: 12, IMMORTAL: 6 }   # 기본 성공률(%)
