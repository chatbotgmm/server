# 수비대 대결(모바일 턴제) 데이터 — 이 파일만 고치면 이름·수치가 바뀌어요.
#
# 고치는 법
#   1. 이 파일에서 이름이나 숫자를 바꿔요. (# 뒤는 메모라 게임에 영향 없음)
#   2. 검사: npm run data:check   ← 잘못 쓰면 어느 줄이 틀렸는지 알려 줘요
#   3. 밸런스 확인(선택): npx tsx scripts/battle-balance.ts 3000 30
#   4. 커밋 → 서버 업데이트(update.sh)
#
# 기술 설명(desc)은 적지 않으면 숫자로 자동으로 만들어져요(위력을 바꾸면 설명도 같이 바뀜).
# 직접 쓰고 싶으면 desc: "..." 를 넣으면 그 글이 우선이에요.
#
# sub: 보조 속성(그 유닛의 4번째 기술 속성). 상성이 불리할 때 꺼내 쓰는 기술
# 속성 코드: STONE 돌, GOLD 황금, FIRE 불, ICE 얼음, BLOSSOM 꽃, SEA 바다, SHADOW 그림자, STAR 별, THREAD 실, GRAVITY 중력
# 역할 코드: ATTACK 공격, DEFENSE 수비, UTILITY 유틸
# 상태 이상: burn 화상, freeze 빙결, sleep 잠, bind 묶임, rage 땅콩 폭주
#
# 효과(effects) 쓰는 법
#   { buff: atk, pct: 25, turns: 3, to: self }   능력치 +25% (atk 공격 / def 방어 / spd 속도). pct가 음수면 약화. to: self 나 / team 아군 전체 / foe 상대
#   { status: sleep, chance: 30, turns: 1 }       상대에게 상태 이상(확률 %)
#   { heal: 30, to: self }                        체력 30% 회복 (to: self 나 / bench 대기 아군)
#   { guard: 40, turns: 2 }                       받는 피해 -40%
#   { endure: 3 }                                 3턴 동안 체력이 1 아래로 안 떨어짐
#   { regen: 8, turns: 4, to: team }             턴이 끝날 때마다 체력 8% 회복 (to: self / team)
#   { cleanse: 2 }                                아군 상태 이상을 풀고 2턴 동안 막음
#   { revive: 50 }                                쓰러진 아군 하나를 체력 50%로 (전투당 1번)
#   { strip: true }                               상대 강화 모두 지우기
#   { recharge: true }                            쓴 다음 턴은 쉼
#   { lockSelf: 25 }                              이후 교체 불가, 대신 공격 +25%
#   { protect: true }                             이번 턴 공격 모두 막기
# 기술 옵션: power 위력, hits 타수, priority: true 무조건 먼저, crit: true 반드시 급소, cd 재사용 대기(턴), attr 공격 속성

version: BATTLE_V1

multipliers: { strong: 1.5, weak: 0.67, sameAttr: 1.2, crit: 1.5, critChance: 6.25, maxGuard: 60 }

# 기본기(basic)는 모두 「똥폭탄」(쓰는 유닛의 속성으로 날아감). 예전 이름으로 되돌리려면 basic만 바꿔요:
#   STONE 돌머리 박치기, GOLD 금화 튕기기, FIRE 불씨 쪼기, ICE 얼음 깃, BLOSSOM 꽃잎 바람, SEA 물보라, SHADOW 그늘 할퀴기, STAR 별똥 박치기, THREAD 실 채찍, GRAVITY 끌어당기기
attributes:
  STONE:   { name: 돌,     basic: 똥폭탄, sub: 돌팔매 }
  GOLD:    { name: 황금,   basic: 똥폭탄, sub: 금빛 일격 }
  FIRE:    { name: 불,     basic: 똥폭탄, sub: 뜨거운 입김 }
  ICE:     { name: 얼음,   basic: 똥폭탄, sub: 서리 바람 }
  BLOSSOM: { name: 꽃,     basic: 똥폭탄, sub: 꽃잎 칼날 }
  SEA:     { name: 바다,   basic: 똥폭탄, sub: 물대포 }
  SHADOW:  { name: 그림자, basic: 똥폭탄, sub: 그림자 찌르기 }
  STAR:    { name: 별,     basic: 똥폭탄, sub: 별빛 화살 }
  THREAD:  { name: 실,     basic: 똥폭탄, sub: 바늘 찌르기 }
  GRAVITY: { name: 중력,   basic: 똥폭탄, sub: 짓누르기 }
basicPower: 50
# 보조 속성 기술(유닛마다 units·villains의 sub로 속성을 정함). 이름은 attributes의 sub. 같은 속성 보너스(×1.2)는 없음
subSkill: { power: 60, cd: 2 }

# 상성: 왼쪽 속성이 오른쪽 두 속성에 강함. 모든 속성이 강점 2·약점 2가 되도록 검사해요
chart:
  SEA:     { strong: [FIRE, STONE],     why: [물이 불을 꺼요, 파도가 바위를 깎아요] }
  FIRE:    { strong: [ICE, BLOSSOM],    why: [불이 얼음을 녹여요, 불이 꽃을 태워요] }
  ICE:     { strong: [SEA, GOLD],       why: [얼음이 바다를 얼려요, 금도 얼면 냉동금고행] }
  BLOSSOM: { strong: [STONE, SHADOW],   why: [뿌리가 바위를 쪼개요, 꽃이 피면 그늘이 밝아져요] }
  STONE:   { strong: [ICE, GRAVITY],    why: [얼음은 돌에 부딪혀 깨져요, 원래 무거운 돌은 끄떡없어요] }
  GOLD:    { strong: [THREAD, GRAVITY], why: [금 장식 앞에서 옷이 초라해져요, 금 저울 위에선 무게가 다 들통나요] }
  THREAD:  { strong: [BLOSSOM, STAR],   why: [옷으로 꽃가루를 막아요, 별자리를 바느질로 꿰매요] }
  SHADOW:  { strong: [STAR, GOLD],      why: [어둠이 별빛을 삼켜요, 그늘에선 금이 반짝이지 못해요] }
  STAR:    { strong: [SEA, SHADOW],     why: [달이 바닷물을 끌어당겨요, 별빛이 밤을 밝혀요] }
  GRAVITY: { strong: [THREAD, FIRE],    why: [실을 끌어당겨 풀어 버려요, 불씨를 꾹 눌러 꺼요] }

# 역할: 레벨 1·진화 전 기본 능력치와 역할기. 역할기 이름의 {속성}은 그 유닛 속성 이름으로 바뀜
roles:
  ATTACK:  { name: 공격, hp: 92,  atk: 30, def: 14, spd: 14, skill: { name: "{속성} 강타", cd: 2, power: 85 } }
  DEFENSE: { name: 수비, hp: 128, atk: 19, def: 26, spd: 9,  skill: { name: 버티기 자세, cd: 3, effects: [ { buff: def, pct: 40, turns: 2, to: self } ] } }
  UTILITY: { name: 유틸, hp: 106, atk: 21, def: 18, spd: 15, skill: { name: 기세 꺾기, cd: 3, power: 40, effects: [ { buff: atk, pct: -25, turns: 3, to: foe } ] } }

# 등급 보정(체력·공격·방어에 곱함). 차이를 작게 둬요
tiers: { LIMITED: 1, TRANSCEND: 1.03, ETERNAL: 1.06, IMMORTAL: 1.09 }

