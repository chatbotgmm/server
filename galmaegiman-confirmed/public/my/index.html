<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>내 갈매미 · 갈매미맨</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f0e3;--card:#fffdf8;--text:#2d2a26;--muted:#6f675c;--line:#e8dcc6;--edge:#d8c7a6;--accent:#1d5b94;--accent-soft:#e2edf7;--gold:#d9a400;--ok:#2f8f5b;--bad:#c0392b;--sea1:#2b7cc4;--sea2:#164b80;--shadow:0 2px 0 var(--edge),0 10px 24px rgba(80,55,20,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#121820;--card:#1c242e;--text:#ececec;--muted:#a3a9b1;--line:#2d3845;--edge:#0c1117;--accent:#8fc1f0;--accent-soft:#22324a;--gold:#f2c14e;--ok:#7ce3a0;--bad:#ff8a7a;--sea1:#1f5d99;--sea2:#0e2c4d;--shadow:0 2px 0 var(--edge),0 10px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
img.gi{width:1.25em;height:1.25em;vertical-align:-.28em;display:inline-block}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px;color:var(--text);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.55;word-break:keep-all}
button,input{font:inherit;color:inherit}
/* 제목·버튼·탭·숫자·이름은 Black Han Sans */
h1,h2,.btn,.tabs button,.filters button,.money b,.u b,.rc .rh b,.gc b,.du b,.tag,.login input,.card>b,.card b[style]{font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:.01em}
a{color:var(--accent)}
#app{max-width:960px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:0 -16px 14px;background:linear-gradient(180deg,var(--sea1),var(--sea2));color:#fff;border-radius:0 0 20px 20px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
header h1{font-size:1.3rem;margin:0;font-weight:400;text-shadow:0 2px 0 rgba(0,0,0,.18)}
header .sp{flex:1}
header a.hl{text-decoration:none;color:#fff;font-size:.9rem;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;white-space:nowrap}
@media (max-width:520px){header h1{display:none}header .lt{display:none}header .logo img{height:26px}}
header{flex-wrap:nowrap;min-width:0}header>*{flex:none}header .sp{flex:1;min-width:0}
html,body{overflow-x:clip}
.shopi{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.qty{display:flex;align-items:center;gap:6px}
.qty .btn.ghost{padding:6px 12px}
.qty input{width:58px;text-align:center;padding:8px 4px;border:1.5px solid var(--edge);border-radius:12px;background:var(--bg);font-size:1rem}
.qty .btn:not(.ghost){white-space:nowrap}
header a.home{text-decoration:none;color:#fff;font-size:.9rem;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:999px}
header .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12);box-shadow:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.login{max-width:380px;margin:40px auto;text-align:center}
.login input{width:100%;font-size:2rem;letter-spacing:.4em;text-align:center;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--accent);color:#fff;cursor:pointer;font-size:1rem;box-shadow:0 3px 0 var(--sea2)}
.btn:active{transform:translateY(2px);box-shadow:none}
@media (prefers-color-scheme:dark){.btn{color:#10151b}}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--card);border:1.5px solid var(--edge);color:var(--text);box-shadow:0 3px 0 var(--edge)}
.btn.wide{width:100%;margin-top:10px}
a.btn{display:inline-block;text-align:center;text-decoration:none}
.btn.kakao{background:#FEE500;color:#191919;box-shadow:0 3px 0 #c9b200}
header .logo img{height:32px;width:auto;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin:8px 0 0}
.steps{text-align:left;color:var(--muted);font-size:.92rem;padding-left:1.2em}
.money{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.money div{background:var(--accent-soft);border-radius:12px;padding:8px;text-align:center}
.money b{display:block;font-size:1.2rem;font-weight:400}
.money small{color:var(--muted);font-size:.75rem}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:6px 0 12px;padding-bottom:2px}
.tabs button{flex:none;border:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 0 var(--sea2)}
@media (prefers-color-scheme:dark){.tabs button.on{color:#10151b}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:.85rem;cursor:pointer}
.filters button.on{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.u{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);text-align:center;position:relative;font-size:.82rem}
.u img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--bg)}
.u b{display:block;font-weight:400;line-height:1.25;margin-top:3px}
.u .n{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px}
.u .away{position:absolute;top:8px;left:8px;background:#2f8f5b;color:#fff;border-radius:999px;font-size:.7rem;padding:0 6px}
.u small{color:var(--muted)}
button.u{cursor:pointer}
.u.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.u .ord{position:absolute;top:8px;left:8px;background:var(--gold);color:#222;border-radius:999px;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.slot{border:2px dashed var(--line);border-radius:12px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;padding:6px;text-align:center}
.slot img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.slot.full{border-style:solid;border-color:var(--gold);color:var(--text)}
.note{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;border-radius:999px;padding:0 7px;background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rc{background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:6px}
.rc.ok{border-color:var(--gold)}
.rh{display:flex;gap:10px;align-items:center}
.rh img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg)}
.rh b{font-weight:400;font-size:1.05rem}.rh small{display:block;color:var(--muted);font-size:.8rem}
.rc ul{list-style:none;margin:0;padding:0;font-size:.88rem}.rc li{color:var(--muted)}.rc li.have{color:var(--text)}.rc li b{font-weight:400}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ggrid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:720px){.ggrid{grid-template-columns:repeat(3,1fr)}}
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start;box-shadow:var(--shadow)}
.gc img{width:72px;height:72px;object-fit:cover;border-radius:14px;background:var(--bg)}
.gc .gi{display:flex;flex-direction:column;gap:6px;min-width:0}
.gc b{font-weight:400;font-size:1.15rem;display:block}.gc small{display:block;color:var(--muted);font-size:.8rem}
.gc .row .btn{flex:1;padding:7px 6px;font-size:.95rem;white-space:nowrap;line-height:1.2}
.gc .row .btn small{display:block;font-size:.72rem;color:inherit;opacity:.8}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.du{position:relative;text-align:center;font-size:.82rem;border:2px solid var(--tc);border-radius:14px;padding:5px;background:var(--card);animation:pop .35s ease-out both}
.du:nth-child(2){animation-delay:.05s}.du:nth-child(3){animation-delay:.1s}.du:nth-child(4){animation-delay:.15s}.du:nth-child(n+5){animation-delay:.2s}
.du img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--bg)}
.du b{display:block;font-weight:400;line-height:1.25;margin-top:3px}.du small{color:var(--tc)}
.du.new{box-shadow:0 0 0 3px rgba(217,164,0,.35)}
.du .nb{position:absolute;top:8px;left:8px;background:var(--gold);color:#222;border-radius:999px;font-size:.68rem;padding:0 6px}
.du .n{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.result{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:10}
.result .card{max-width:480px;width:100%;max-height:80vh;overflow:auto}
.pre{white-space:pre-wrap;margin:0 0 6px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"><p class="empty">불러오는 중…</p></div>
<div class="toast" id="toast"></div>
<script src="/my/my.js"></script>
</body>
</html>
