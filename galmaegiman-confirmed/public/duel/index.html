}

/* 「내 갈매미」 게임 안 창(v0.10.1) */
.myov{position:fixed;inset:0;z-index:40;background:#3b2614;animation:myIn .2s ease-out}
.myov iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .15s}
.myov.ready iframe{opacity:1}
.myov-load{position:absolute;inset:0;display:grid;place-items:center;color:#f6e2b8;font-size:16px}
.myov.out{animation:myOut .18s ease-in forwards}
@keyframes myIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@keyframes myOut{to{opacity:0;transform:scale(.98)}}

/* ════ 로비 「오늘」(v0.10.4): 출석 7칸 + 오늘의 미션 ════ */
.sheet.today h2{display:flex;align-items:center;justify-content:space-between}
.sheet.today .xbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--edge);background:#fffaf0;color:var(--ink);font-size:16px;box-shadow:0 2px 0 rgba(90,52,22,.4)}
@media (orientation:landscape){ .sheet.today{max-width:min(940px,96vw) !important} .sheet.today .scols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px;align-items:start} }
.att,.msn{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.att>b,.msn>b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:16px}
.msn>small{color:var(--dim);margin-top:-6px}
.att-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.att-d{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:10px;border:2px solid var(--line);background:#fffdf7}
.att-d small{font-size:10.5px;color:var(--dim)}.att-d span{font-size:18px}.att-d em{font-style:normal;font-size:11px;font-weight:700}
.att-d.on{border-color:var(--gold);background:#fff4d6}
.att-d.big{border-color:var(--gold)}
.att-d.now{border-color:var(--accent-d);background:#fbe6cf;box-shadow:0 0 0 2px var(--accent-hi)}
.att-note{display:block;font-size:11px;color:var(--dim);margin-top:-2px}
.msn-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.msn-r b{display:block;font-size:13.5px;font-weight:700}
.msn-r>div>i{display:block;height:7px;border-radius:999px;background:#ead6ae;margin-top:3px;overflow:hidden}
.msn-r>div>i>i{display:block;height:100%;background:linear-gradient(90deg,#ffd27a,var(--gold))}
.msn-r em{font-style:normal;font-size:12px;color:var(--dim);white-space:nowrap}
.msn-r.ok b{color:var(--dim);text-decoration:line-through}
@media (orientation:landscape) and (max-height:400px){ .att,.msn{padding:6px 10px;gap:5px} .msn-r b{font-size:12.5px} .att-d span{font-size:15px} }
#modal:has(.sheet.today){align-items:center}
.sheet.today{border-radius:18px;border:3px solid var(--edge)}

/* 누를 때 파란 상자(안드로이드 탭 강조·포커스 테두리) 없애기. 키보드로 옮길 때만 테두리 */
html,body,*{-webkit-tap-highlight-color:transparent}
:focus:not(:focus-visible){outline:none}
.rv-egg,.reveal,.forge,.u,.lhero,.pd,.ware{-webkit-user-select:none;user-select:none}

/* 말풍선이 대표 갈매미 얼굴을 가리던 것 → 머리 위 오른쪽 옆으로 빼고, 꼬리는 왼쪽 아래(갈매미 쪽)를 가리킴 */
.lbub{top:0;left:auto;right:-6%;transform:none;max-width:min(60%,300px);font-size:13.5px;padding:7px 12px}
.lbub::after{left:22%;transform:rotate(45deg)}
.lbub.pop{animation:bubPop2 .25s ease-out}
@keyframes bubPop2{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.lhero img{margin-top:34px}

/* ── 플레이 → 모드 고르기(v0.11.0): 왼쪽 캠페인 · 오른쪽 PvP · 아래 돌아가기 ── */
.modes{position:fixed;z-index:5;inset:0;max-width:none;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;align-items:stretch;
  padding:calc(12px + env(safe-area-inset-top,0px)) calc(20px + var(--sr)) calc(12px + env(safe-area-inset-bottom,0px)) calc(20px + var(--sl));background:center/cover no-repeat #cfe3ef;overflow:hidden}
.modes .lbg{position:absolute;inset:-20px;background:inherit;filter:blur(6px) saturate(.9) brightness(1.04);z-index:0}
.modes>*:not(.lbg):not(.amb){position:relative;z-index:1}
.mtitle{margin:0;text-align:center;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:26px;color:#fffaf0;text-shadow:0 2px 0 var(--edge),0 0 8px rgba(60,35,15,.5)}
.mrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1080px;width:100%;margin:0 auto;min-height:0}
.modes .mrow{align-self:center;max-height:100%}   /* 카드는 내용만큼(큰 화면에서 아래가 비지 않게), 위아래 가운데 */
body:has(.modes) #mute{display:none}
.mcard{background:rgba(255,250,240,.96);border:3px solid var(--edge);border-radius:20px;box-shadow:0 6px 0 rgba(90,52,22,.45);padding:14px 16px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:auto}
.mhead{display:flex;align-items:center;gap:10px;border-bottom:2px dashed var(--line);padding-bottom:8px}
.mhead>i{font-style:normal;font-size:34px;line-height:1}
.mhead b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:24px;color:var(--ink)}
.mhead small{display:block;color:var(--dim);font-size:12.5px;line-height:1.35}
.mbtn{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 14px;border-radius:14px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(122,78,42,.3)}
.mbtn>i{font-style:normal;font-size:26px;line-height:1}
.mbtn b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:19px}
.mbtn small{display:block;color:var(--dim);font-size:12px}
.mbtn.main{background:linear-gradient(var(--accent-hi),var(--accent));border-color:var(--accent-d);box-shadow:0 4px 0 var(--accent-d);color:var(--on-accent)}
.mbtn.main small{color:#5a3a1c}
.mbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
.mbtn:disabled{opacity:.55;border-style:dashed;box-shadow:none}
.mlinks{display:flex;gap:8px;justify-content:center}
.mlink{align-self:center;border:2px dashed var(--line);background:transparent;border-radius:999px;padding:4px 14px;font-size:13px;color:var(--dim)}
.mlink:disabled{opacity:.5}
.mrank{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:7px 10px;border-radius:12px;background:#f6ead2;border:2px solid var(--line);font-size:13px;color:var(--dim)}
.mrank .tier{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:17px;color:var(--ink)}
.mwarn{font-style:normal;color:#a3541b;font-size:12px;flex-basis:100%}
.mback{justify-self:center;font-family:"Black Han Sans",sans-serif;font-size:18px;padding:8px 30px;border-radius:999px;border:2.5px solid var(--edge);background:linear-gradient(#fffdf5,#f1d9a8);color:var(--ink);box-shadow:0 3px 0 var(--edge)}
@media (orientation:landscape) and (max-height:430px){
  .modes{gap:6px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .mtitle{font-size:20px}.mcard{padding:8px 12px;gap:6px}.mhead{padding-bottom:5px}.mhead>i{font-size:26px}.mhead b{font-size:19px}.mhead small{font-size:11px}
  .mbtn{padding:6px 12px}.mbtn>i{font-size:20px}.mbtn b{font-size:16px}.mbtn small{font-size:11px}.mrank{padding:4px 8px}.mrank .tier{font-size:15px}.mback{font-size:15px;padding:5px 24px}
}
@media (orientation:landscape) and (min-height:601px){ .mtitle{font-size:34px} .mcard{padding:20px 22px;gap:14px} .mbtn{padding:16px 18px} .mbtn b{font-size:23px} .mbtn small{font-size:14px} .mhead b{font-size:30px} .mhead small{font-size:15px} }
/* PvP 상대 소개(VS) · 순위표 */
#modal:has(.sheet.pvs){align-items:center}
.sheet.pvs{max-width:min(720px,94vw) !important;border-radius:20px;border:3px solid var(--edge);text-align:center;display:flex;flex-direction:column;gap:8px}
.pvs-mode{color:var(--dim)}
.pvs-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.pvs-side b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:19px}
.pvs-side small{display:block;color:var(--dim);font-size:12px}
.pvs-team{display:flex;justify-content:center;gap:2px;margin-top:4px}
.pvs-team img{width:min(76px,11vw);height:min(76px,11vw);object-fit:contain}
.pvs-side.me .pvs-team img{transform:scaleX(-1)}
.pvs-vs{font-style:normal;font-family:"Bagel Fat One","Black Han Sans",sans-serif;font-size:34px;color:var(--accent-d)}
.sheet.pvs .sub{margin:0}
.ptl{display:flex;flex-direction:column;gap:5px;max-height:min(60vh,420px);overflow:auto}
.ptr{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--card);border:2px solid var(--line)}
.ptr em{font-style:normal;font-weight:700;text-align:center}.ptr b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ptr span{font-size:13px}.ptr small{color:var(--dim);font-size:12px}
.ptr.me{border-color:var(--accent-d);background:var(--accent-soft)}

/* ── 증강체 고르기 v0.11.0: 전략적 팀 전투·칼바람 아수라장처럼 — 어두운 장막 위에 세로로 긴 카드 3장이 차례로 떠오르고, 고른 카드는 빛남, 카드 아래 다시 뽑기 ── */
#modal.full{background:radial-gradient(ellipse at 50% 45%,rgba(64,36,12,.97),rgba(16,8,2,.99))}
#modal.full .sheet.pick.full{background:transparent;border:0;box-shadow:none;color:#fff3dc}
#modal.full .sheet.pick.full h2{color:#ffe9c4;text-shadow:0 2px 0 #3b2614,0 0 14px rgba(240,189,133,.55);letter-spacing:.06em}
#modal.full .sheet.pick.full h2::before,#modal.full .sheet.pick.full h2::after{content:'◆';font-size:.5em;color:var(--accent-hi);vertical-align:middle;margin:0 .7em;opacity:.8}
#modal.full .sheet.pick.full .vs{background:rgba(255,243,220,.1);border:1.5px solid rgba(240,189,133,.45);color:#fff3dc}
#modal.full .sheet.pick.full .vs .mid small,#modal.full .sheet.pick.full .vs .side b{color:#f3dfc0}
#modal.full .sheet.pick.full .tipline{background:rgba(230,244,220,.92)}
.sheet.pick.full .augc{perspective:900px}
.sheet.pick.full .augc .aug{position:relative;border-radius:18px;border:3px solid #c9965a;background:linear-gradient(170deg,#fffaf0 0%,#fbecd0 55%,#f1d6a6 100%);
  box-shadow:inset 0 0 0 3px #fffaf0,inset 0 0 0 5px rgba(201,150,90,.55),0 8px 0 rgba(0,0,0,.35);transition:transform .16s ease,box-shadow .16s ease,border-color .16s}
.sheet.pick.full.enter .augc .aug{animation:augRise .45s cubic-bezier(.2,.9,.3,1.2) both}
.sheet.pick.full.enter .augc:nth-of-type(2) .aug{animation-delay:.08s}.sheet.pick.full.enter .augc:nth-of-type(3) .aug{animation-delay:.16s}
.sheet.pick.full .augc.rolled .aug{animation:rollin .35s ease-out}
@keyframes augRise{from{transform:translateY(40px) rotateX(35deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.sheet.pick.full .augc .aug:hover{transform:translateY(-4px)}
.sheet.pick.full .augc .aug.on{border-color:var(--accent-hi);transform:translateY(-6px);
  box-shadow:inset 0 0 0 3px #fffaf0,inset 0 0 0 5px var(--accent),0 0 0 3px var(--accent-hi),0 0 26px 6px rgba(240,189,133,.75),0 10px 0 rgba(0,0,0,.35)}
.sheet.pick.full .augc .aug .ic{border-radius:50%;background:radial-gradient(circle at 50% 40%,#fffdf6,#f3dcb2);box-shadow:0 0 0 3px #c9965a,0 0 0 6px #fffaf0,0 3px 6px rgba(60,35,15,.35);padding:6px;box-sizing:content-box}
.sheet.pick.full .augc .aug .tx small{display:inline-block;align-self:center;background:#7a4e2a;color:#fff3dc !important;border-radius:999px;padding:1px 10px;font-size:11.5px;letter-spacing:.05em}
.sheet.pick.full .augc .aug .ck{display:none}
.sheet.pick.full .augc .aug.on::after{content:'✓ 선택';position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:linear-gradient(var(--accent-hi),var(--accent));color:var(--on-accent);border:2px solid var(--accent-d);border-radius:999px;padding:1px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.sheet.pick.full .augc .reroll{background:rgba(255,243,220,.12);border:1.5px dashed rgba(240,189,133,.7);color:#fff3dc;border-radius:999px}
.sheet.pick.full .augc .reroll:disabled{opacity:.45}
.sheet.pick.full>.aug{background:rgba(255,250,240,.95)}
@media (prefers-reduced-motion:reduce){.sheet.pick.full .augc .aug,.sheet.pick.full.enter .augc .aug{animation:none !important}}
@media (orientation:landscape) and (min-height:601px){ .sheet.pick.full .augc .aug .tx small{font-size:14px;padding:2px 14px} }
/* 작은 가로(높이 400 이하): 메달·글자를 줄여 카드 안에 다 들어가게(위 메달 잘림·설명 넘침 고침) */
@media (orientation:landscape) and (max-height:400px){
  .sheet.pick.full .augc .aug{padding:6px 8px;gap:2px}
  .sheet.pick.full .augc .aug .ic,.sheet.pick.full .augc .aug .ic .ico{width:30px;height:30px;font-size:22px}
  .sheet.pick.full .augc .aug .ic{padding:3px;box-shadow:0 0 0 2px #c9965a,0 0 0 4px #fffaf0;margin-top:4px}
  .sheet.pick.full .augc .aug .tx{gap:1px}
  .sheet.pick.full .augc .aug .tx b{font-size:15px}
  .sheet.pick.full .augc .aug .tx small{font-size:10.5px;padding:0 8px}
  .sheet.pick.full .augc .aug .tx span{font-size:12px;line-height:1.35}
}

/* 그림 아이콘(GPT 75~81번, public/battle/icons): 들어오면 이모지 대신 자동으로 */
.lside i .ico,.lprof i .ico,.mhead>i .ico,.mbtn>i .ico{width:1.25em;height:1.25em;object-fit:contain;vertical-align:middle;filter:drop-shadow(0 1px 1px rgba(60,35,15,.3))}
.lcur .ico{width:17px;height:17px;object-fit:contain;vertical-align:-3px}
.tico:empty{display:none}.tico .ico{width:22px;height:22px;object-fit:contain;vertical-align:-5px;margin-right:2px}

/* ── v0.11.1 「누르는 것」과 「보기만 하는 것」 구분 ──
   누르는 것 = 진한 갈색 테두리 + 아래로 두툼한 그림자(떠 있음) + 누르면 내려앉음. 프로필은 ▾, 재화는 ＋ 표시
   보기만 하는 것 = 얇고 연한 테두리, 그림자 없음(바닥에 붙은 안내판) */
.lprof{font:inherit;color:inherit;text-align:left;cursor:pointer;box-shadow:0 4px 0 rgba(60,35,15,.5)}
.lprof .caret{font-style:normal;font-size:12px;color:var(--edge);margin-left:2px;align-self:center}
.cur{font:inherit;display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 11px;border-radius:999px;background:rgba(255,250,240,.96);border:2px solid var(--edge);font-size:13px;color:var(--ink);box-shadow:0 3px 0 rgba(60,35,15,.5);white-space:nowrap;cursor:pointer}
.cur b{font-weight:700}
.cur .plus{font-style:normal;width:19px;height:19px;border-radius:50%;background:#fffdf5;border:1.5px solid var(--edge);color:var(--edge);display:grid;place-items:center;font-weight:900;font-size:15px;line-height:1;margin-left:2px}

/* 프로필 메뉴(작은 팝업) */
.pmenu{position:fixed;z-index:60;top:calc(8px + env(safe-area-inset-top,0px) + 54px);left:calc(14px + var(--sl));min-width:230px;max-width:calc(100vw - 28px);background:#fffaf0;border:2.5px solid var(--edge);border-radius:16px;box-shadow:0 6px 0 rgba(60,35,15,.35),0 10px 24px rgba(30,15,5,.35);padding:8px;display:flex;flex-direction:column;gap:5px;animation:pmIn .15s ease-out;color:var(--ink)}
@keyframes pmIn{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.pmenu::before{content:'';position:absolute;top:-9px;left:26px;width:14px;height:14px;background:#fffaf0;border-left:2.5px solid var(--edge);border-top:2.5px solid var(--edge);transform:rotate(45deg)}
.pm-head{padding:4px 8px 7px;border-bottom:1.5px dashed var(--line);display:flex;flex-direction:column;gap:2px}
.pm-head b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:17px}
.pm-head small{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:3px}
.pmenu button,.pm-a{font:inherit;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(122,78,42,.3);text-decoration:none;font-size:14px;cursor:pointer;text-align:left}
.pmenu button:active,.pm-a:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(122,78,42,.3)}
.pmenu button i,.pm-a i{font-style:normal;width:22px;text-align:center}.pmenu button i .ico{width:22px;height:22px;object-fit:contain;vertical-align:middle}
@media (orientation:landscape) and (max-height:430px){ .pmenu{top:calc(6px + env(safe-area-inset-top,0px) + 44px);padding:6px;gap:4px} .pmenu button,.pm-a{padding:5px 9px;font-size:13px} }

/* 게임에서는 글자를 길게 눌러도 선택·번역·복사 팝업이 뜨지 않게(입력칸은 그대로, v0.11.1) */
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;-webkit-touch-callout:none}

/* 스토리 목록 가로(v0.11.1): 왼쪽 팀 · 오른쪽 장 목록(페이지는 안 넘어가고 오른쪽만 넘김), 글자 크고 진하게 */
@media (orientation:landscape){
  #app:has(.story){max-width:none}
  .story{position:fixed;inset:0;display:grid;grid-template-columns:minmax(250px,32%) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:0 16px;
    padding:calc(4px + env(safe-area-inset-top,0px)) calc(14px + var(--sr)) calc(8px + env(safe-area-inset-bottom,0px)) calc(14px + var(--sl))}
  .story>header{grid-column:1/-1;padding:6px 64px 6px 0}
  .story>header small{font-size:15px;color:var(--ink)}
  .steam{min-height:0;overflow:auto;padding-bottom:4px}
  .steam .teambar{margin:0;grid-template-columns:1fr;gap:8px;padding:10px;background:rgba(255,250,240,.6);border:1.5px solid rgba(122,78,42,.3);box-shadow:none}
  .steam button.mini{display:grid;grid-template-columns:62px minmax(0,1fr);grid-template-rows:auto auto auto auto;column-gap:10px;row-gap:2px;align-items:center;text-align:left;
    background:var(--card);border:2px solid var(--edge);border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 rgba(60,35,15,.45)}
  .steam button.mini:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,35,15,.45)}
  .steam .mini img{grid-row:1/5;width:62px;height:62px}
  .steam .mini b{font-size:17px;color:var(--ink)}
  .steam .mini span{font-size:14px;color:var(--ink);display:flex;gap:6px;align-items:center;justify-content:flex-start}
  .steam .mini .xp{width:100%;height:8px;margin:2px 0}
  .steam .mini small,.steam .mini .learn{justify-self:start;margin-top:1px}
  .steam .mini small{font-size:12.5px;color:var(--edge);font-weight:700}
  .steam .combo{font-size:13.5px;margin:2px 0;text-align:center;color:var(--ink)}
  .steam .teambar .ghost{padding:9px;font-size:15px;border:2px solid var(--edge);box-shadow:0 3px 0 rgba(60,35,15,.45)}
  .schap{min-height:0;overflow:auto;padding-right:4px}

  .schap>div{padding:0 0 12px !important}
}
@media (orientation:landscape) and (max-height:430px){

  .steam .mini img{width:46px;height:46px}
  .steam .mini b{font-size:15px}.steam .mini span{font-size:12.5px}
  .steam .teambar .ghost{padding:6px;font-size:14px}
}

/* 아래 메뉴는 들어 있는 개수만큼 칸(계정은 프로필 메뉴로 옮겨 5개, v0.11.1) */
.ts.lobby .dock{grid-template-columns:none !important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);max-width:560px}

/* ── 로비 v0.12.0(8번 시안): 그림 배경 + 내 정보·재화 작게 + 아래 나무 팻말 메뉴 + 큰 플레이 ──
   색: 나무 테두리 #e2a764/#c27c3d/#8a5527, 판 색은 메뉴마다(민트·분홍·연보라·하늘·살구), 글자는 흰색+갈색 테두리(받은 버튼 그림과 같게) */
:root{--wood:#e2a764;--wood-d:#c27c3d;--wood-dd:#8a5527;--p-mint:#a9d3a4;--p-pink:#f29aa6;--p-lilac:#b9a2dc;--p-sky:#9fcbe6;--p-peach:#f5a98f}
#app:has(.home8){max-width:none}
.home8{position:fixed;inset:0;background:#e9d6f0 center/cover no-repeat;overflow:hidden}
.home8>.amb{z-index:0}
.home8>*:not(.amb){position:absolute;z-index:1}
.h8top{top:calc(10px + env(safe-area-inset-top,0px));left:calc(14px + var(--sl));right:calc(78px + var(--sr));display:flex;align-items:center;justify-content:space-between;gap:10px}
.home8 .lprof{background:rgba(255,250,240,.95);border:3px solid var(--wood);box-shadow:0 4px 0 var(--wood-d)}
.home8 .lprof>i{border-color:var(--wood)}
.home8 .lcur{display:flex;gap:6px}
.home8 .cur{border:2.5px solid var(--wood);box-shadow:0 3px 0 var(--wood-d)}
.h8att{left:calc(14px + var(--sl));top:calc(50% - 46px);width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border-radius:18px;background:rgba(255,250,240,.95);border:3px solid var(--wood);box-shadow:0 4px 0 var(--wood-d);font:inherit;color:#5a3418;cursor:pointer}
.h8att i{font-style:normal;font-size:28px;line-height:1}.h8att i .ico{width:34px;height:34px;object-fit:contain}
.h8att span{font-family:"Black Han Sans",sans-serif;font-size:14px}
.h8att:active,.h8b:active,.h8play:active{transform:translateY(3px)}
.home8 .dot{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:#ff5a5a;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.h8menu{left:calc(14px + var(--sl));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.h8b{position:relative;display:block;height:var(--bh,64px);text-decoration:none;filter:drop-shadow(0 4px 0 rgba(90,52,24,.35))}
.h8b.img img{height:100%;width:auto;display:block}
/* 그림이 없는 메뉴(조합)는 같은 모양을 코드로: 둥근 나무 테두리 + 파스텔 판 + 글자 */
.h8b.code{display:flex;align-items:center;gap:6px;padding:0 calc(var(--bh,64px) * .32) 0 calc(var(--bh,64px) * .22);border-radius:calc(var(--bh,64px) * .3);
  background:var(--pc,#ccc);border:calc(var(--bh,64px) * .09) solid var(--wood);box-shadow:inset 0 0 0 2px var(--wood-d),inset 0 -6px 0 rgba(0,0,0,.08);aspect-ratio:2.47/1;justify-content:center}
.h8b.code i{font-style:normal;font-size:calc(var(--bh,64px) * .5);line-height:1}
.h8b.code span{font-family:"Bagel Fat One","Black Han Sans",sans-serif;font-size:calc(var(--bh,64px) * .38);color:#fff;-webkit-text-stroke:calc(var(--bh,64px) * .07) #5a3418;paint-order:stroke fill;letter-spacing:.02em}
.h8b.mint{--pc:var(--p-mint)}.h8b.pink{--pc:var(--p-pink)}.h8b.lilac{--pc:var(--p-lilac)}.h8b.sky{--pc:var(--p-sky)}.h8b.peach{--pc:var(--p-peach)}
.h8play{right:calc(16px + var(--sr));bottom:calc(10px + env(safe-area-inset-bottom,0px));min-width:min(30vw,300px);height:calc(var(--bh,64px) * 1.25);padding:0 22px;border-radius:calc(var(--bh,64px) * .45);
  background:linear-gradient(#ffc27a,#ff9d52);border:calc(var(--bh,64px) * .1) solid var(--wood);box-shadow:inset 0 0 0 2px var(--wood-d),inset 0 -8px 0 rgba(160,70,20,.25),0 5px 0 var(--wood-dd);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font:inherit;cursor:pointer}
.h8play b{font-family:"Bagel Fat One","Black Han Sans",sans-serif;font-weight:400;font-size:calc(var(--bh,64px) * .5);color:#fff;-webkit-text-stroke:calc(var(--bh,64px) * .08) #5a3418;paint-order:stroke fill;line-height:1.05}
.h8play small{font-size:calc(var(--bh,64px) * .2);color:#5a3418;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (orientation:landscape) and (max-height:430px){
  .home8{--bh:42px}
  .h8top{top:calc(6px + env(safe-area-inset-top,0px));right:calc(64px + var(--sr))}
  .h8att{width:66px;padding:5px 3px 4px;border-radius:14px}.h8att i{font-size:22px}.h8att i .ico{width:26px;height:26px}.h8att span{font-size:12px}
  .h8menu{gap:6px}.h8play{padding:0 14px;min-width:0}
}
@media (orientation:landscape) and (min-height:431px) and (max-height:600px){ .home8{--bh:50px} }
@media (orientation:landscape) and (min-height:601px){ .home8{--bh:70px} .h8att{width:96px} }
.mrecap{display:block;font-size:11px;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* v0.12.0 8번 시안 맞춤: 칸 테두리를 짙은 갈색 → 나무색(받은 버튼 테두리와 같은 계열), 조합 팻말 테두리 두껍게, 모드 버튼 요약 줄 넘침 막기 */
:root{--edge:#a8672e}
.h8b.code{border-width:calc(var(--bh,64px) * .13);box-shadow:inset 0 0 0 2.5px var(--wood-d),inset 0 -7px 0 rgba(0,0,0,.08),0 0 0 2px var(--wood-d)}
.mbtn>span{min-width:0;flex:1}

/* v0.12.2 받은 버튼 그림(출석체크·플레이·돌아가기): 그림 그대로, 테두리·배경 없이 */
.h8att.img,.h8play.img,.mback.img{background:none !important;border:0 !important;box-shadow:none !important;padding:0 !important;width:auto;min-width:0;filter:drop-shadow(0 4px 0 rgba(90,52,24,.35))}
.h8att.img{top:calc(50% - var(--bh,64px) * .75)}
.h8att.img img{height:calc(var(--bh,64px) * 1.45);width:auto;display:block}
.h8play.img{height:auto}
.h8play.img img{height:calc(var(--bh,64px) * 1.3);width:auto;display:block}
.h8play.img small{position:absolute;left:0;right:0;bottom:calc(var(--bh,64px) * -.08);text-align:center;font-size:calc(var(--bh,64px) * .19);color:#fff;text-shadow:0 1px 2px #5a3418,0 0 3px #5a3418}
.h8play.img .dot{top:2px;right:2px}
.mback.img img{height:44px;width:auto;display:block}
@media (orientation:landscape) and (min-height:601px){ .mback.img img{height:56px} }

/* 플레이 아래 글자 → 버튼 위 작은 꼬리표(작은 화면에서 아래로 잘리던 것) */
.h8play.img small{bottom:auto;top:calc(var(--bh,64px) * -.42);left:50%;right:auto;transform:translateX(-50%);max-width:110%;background:rgba(255,250,240,.95);color:#5a3418;text-shadow:none;border:2px solid var(--wood);border-radius:999px;padding:1px 10px;font-size:calc(var(--bh,64px) * .21)}
/* 게임 모드 칸: 받은 시안처럼 나무 테두리 + 모서리 금 못 + 줄마다 ▶ */
.mcard{border:5px solid var(--wood) !important;box-shadow:inset 0 0 0 2px var(--wood-d),0 5px 0 var(--wood-dd) !important;border-radius:22px !important;
  background:radial-gradient(circle at 12px 12px,#f2c14e 4px,#b8862a 5px,transparent 6px),radial-gradient(circle at calc(100% - 12px) 12px,#f2c14e 4px,#b8862a 5px,transparent 6px),
  radial-gradient(circle at 12px calc(100% - 12px),#f2c14e 4px,#b8862a 5px,transparent 6px),radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),#f2c14e 4px,#b8862a 5px,transparent 6px),#fdf4e3 !important}
.mbtn{position:relative;padding-right:34px !important;border-color:#e3b47a !important;background:#fbe8cc !important;color:#3b2614 !important}
.mbtn::after{content:'▶';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#c98a4b;font-size:14px}
.mbtn.main{background:linear-gradient(#ffd9a6,#ffc27a) !important;border-color:var(--wood-d) !important}
.mbtn:disabled{background:#efe3d2 !important}

/* 게임 모드 아이콘 그림(받은 시안에서 자름): 이모지보다 크게 */
.mhead>i .ico{width:2.1em;height:2.1em}
.mbtn>i .ico{width:1.9em;height:1.9em}

@media (orientation:landscape) and (max-height:430px){ .mback.img img{height:32px} .modes .mrow{max-height:calc(100% - 4px)} .mhead>i .ico{width:1.8em;height:1.8em} .mbtn>i .ico{width:1.6em;height:1.6em} }

/* 설정 톱니 그림(둥근 나무 버튼 통째로) */
.mute.img,.tset.img{background:none !important;border:0 !important;box-shadow:none !important;padding:0 !important;width:52px !important;height:auto !important;filter:drop-shadow(0 3px 0 rgba(90,52,24,.35))}
.mute.img img,.tset.img img{width:100%;height:auto;display:block}
@media (orientation:landscape) and (max-height:430px){ .mute.img,.tset.img{width:44px !important} }
@media (orientation:landscape) and (min-height:601px){ .mute.img,.tset.img{width:64px !important} }
.pmenu button i .ico{width:24px;height:24px}

.sheet.today h2 .ico{width:30px;height:30px;object-fit:contain;vertical-align:-7px}
.tdh{display:inline-flex;align-items:center;gap:6px}
</style>
