<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>갈매미맨 수비대</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#164b80"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
img.gi{width:1.25em;height:1.25em;vertical-align:-.28em;display:inline-block}
/* 글꼴: 제목·버튼·이름·숫자는 Black Han Sans, 본문은 Gowun Dodum */
h1,h2,.big,.nm span,.dmg,.banner,.comboflash b,.five-big,.titlecard b,.place,.who,.stage .no,.mini b,.combo-btn b,.sk b,.aug .tx b,.promo-fx b{font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:.01em}
:root{--bg:#14202b;--panel:#1d2c3a;--line:#2f4356;--ink:#f4efe4;--dim:#9fb0bf;--gold:#e9c46a;--hp:#5bd17a;--hpmid:#f2c14e;--hplow:#ef5a4c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
body{font-synthesis:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px 4px;display:flex;align-items:baseline;gap:8px}
header h1{font-size:18px;margin:0}
header small{color:var(--dim)}
.hint{color:var(--dim);font-size:13px;margin:4px 16px 8px;line-height:1.5}
.err{background:#4a1f22;border:1px solid #8a3a3f;margin:16px;padding:12px;border-radius:10px;white-space:pre-wrap;font-size:13px}
/* 편성 */
.bar{display:flex;gap:8px;align-items:center;padding:0 16px 8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--gold);color:#222;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 120px}
.card{background:var(--panel);border:2px solid transparent;border-radius:12px;padding:6px;text-align:left;position:relative}
.card.on{border-color:var(--gold)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:#0e161e}
.card b{display:block;font-size:12px;margin-top:4px;line-height:1.25;word-break:keep-all}
.card .n{position:absolute;top:10px;left:10px;background:var(--gold);color:#222;font-weight:800;border-radius:999px;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.chip{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;color:#111;font-weight:700;margin-right:3px}
.role{display:inline-block;font-size:11px;color:var(--dim)}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 16px 16px}
.foot .in{max-width:488px;margin:0 auto;display:flex;gap:8px}
.big{flex:1;background:var(--gold);color:#222;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px}
.big:disabled{opacity:.4}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:700}
/* 대결 */
#arena{position:relative;width:100%;aspect-ratio:10/8.4;overflow:hidden;
  background:linear-gradient(#9fd8f2 0%,#cdeefa 38%,#6fb9dd 38.2%,#3d8fc2 47%,#e8d6a8 47.2%,#d9c08a 100%)}
#arena::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,transparent 55%,rgba(0,0,0,.18));pointer-events:none}
.plat{position:absolute;border-radius:50%;background:radial-gradient(ellipse,#cbb07a 0%,#b8975c 60%,rgba(150,120,70,0) 72%)}
.plat.foe{width:46%;height:11%;right:4%;top:40%}
.plat.me{width:62%;height:14%;left:-4%;bottom:2%}
.mon{position:absolute;transform-origin:50% 100%;pointer-events:none;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18))}
.mon.foe{height:36%;right:8%;top:8%}
.mon.me{height:50%;left:3%;bottom:7%}
.box{position:absolute;background:rgba(20,32,43,.88);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:6px 8px;width:50%;font-size:12px}
.box.foe{left:3%;top:3%}
.box.me{right:3%;bottom:4%}
.box .nm{display:flex;justify-content:space-between;gap:4px;font-weight:700;font-size:13px}
.box .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .nm em{font-style:normal;color:var(--dim);font-weight:400;flex:none}
.hpb{height:7px;background:#0b1218;border-radius:4px;overflow:hidden;margin:4px 0 2px}
.hpb i{display:block;height:100%;background:var(--hp);transition:width .45s ease,background .45s}
.row{display:flex;justify-content:space-between;align-items:center;gap:4px;min-height:16px}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--hp)}
.dots i.down{background:#56606a}
.st{font-size:10px;padding:0 4px;border-radius:4px;background:#5a3fa0;margin-left:2px}
.augs{color:var(--gold);font-size:10px;margin-top:2px;line-height:1.3;display:flex;flex-wrap:wrap;gap:2px 6px}
.augs span{display:inline-flex;align-items:center;gap:2px}.augs .ico{width:14px;height:14px}
.aug .ic .ico{width:40px;height:40px;object-fit:contain}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pt{position:absolute;width:10px;height:10px;border-radius:50%}
.dmg{position:absolute;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000}
.banner{position:absolute;left:0;right:0;top:44%;text-align:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 #000}
#msg{min-height:58px;margin:8px 16px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.45}
#panel{padding:0 16px 20px;display:flex;flex-direction:column;gap:8px}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sk{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c,#888);border-radius:12px;padding:8px 10px;min-width:0}
.sk:disabled{opacity:.42}
.sk .kd{font-size:10px;color:var(--dim)}
.sk b{font-size:15px;line-height:1.25;word-break:keep-all}
.sk .ln{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sk .ln small{color:var(--dim);font-size:11px}
.sk .ln em{font-style:normal;font-size:11px;font-weight:800}
.sk p{margin:0;color:var(--dim);font-size:11px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shot{position:absolute;font-size:36px;line-height:1;pointer-events:none}
.feather{position:absolute;width:9px;height:17px;border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;background:linear-gradient(#fffdf6,#e9e1cf);box-shadow:0 0 6px #fff8}
.mote{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff6d6;box-shadow:0 0 10px 3px #ffe9a8}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(10,16,24,.45))}
.box.down{filter:grayscale(1);opacity:.75}
.box .nm em.ko{color:#ffb4a8;font-weight:700;font-size:11px;border:1px solid #ffb4a866;border-radius:6px;padding:0 5px}
.sw{display:flex;gap:8px}
.sw button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;align-items:center;gap:6px;font-size:12px;text-align:left}
.sw button:disabled{opacity:.42}
.sw img{width:34px;height:34px;object-fit:contain}
/* 메뉴·스토리 */
.menu{display:flex;flex-direction:column;gap:10px;padding:8px 16px}
.back{background:none;border:0;font-size:26px;line-height:1;padding:0 6px 0 0;color:var(--ink)}
.teambar{margin:4px 16px 12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teambar .ghost{grid-column:1/-1;padding:10px}
.mini{text-align:center;font-size:11px;min-width:0}
.mini img{width:100%;height:70px;object-fit:contain}
.mini b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.xp{display:block;height:4px;background:#0b1218;border-radius:2px;overflow:hidden;margin-top:3px}
.xp i{display:block;height:100%;background:var(--gold)}
.chap{padding:0 16px 8px}
.chap h2{font-size:16px;margin:10px 0 6px}
.stage{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.stage:disabled{opacity:.4}
.stage .no{font-weight:800;color:var(--gold);width:34px;flex:none}
.stage .tt{flex:1;min-width:0;font-weight:700}
.stage .tt small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:2px}
.stage .tt em{font-style:normal;font-size:10px;background:#8e3b46;color:#fff;border-radius:4px;padding:0 4px;margin-left:4px}
.stage .mk{font-size:12px;color:var(--dim);flex:none}
.stage.done .mk{color:var(--hp);font-weight:800}
/* 대사 화면(비주얼노벨) */
#modal.scene-on{align-items:stretch;background:#000}
.scene{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;cursor:pointer;user-select:none}
.sc-harbor{background:linear-gradient(#8fd0f0 0%,#cdeefa 40%,#5fb0db 40.3%,#2f7fb5 58%,#e6d3a3 58.3%,#cdb27a 100%)}
.sc-ink{background:radial-gradient(circle at 20% 70%,#111a 0 7%,transparent 7.5%),radial-gradient(circle at 75% 80%,#111b 0 9%,transparent 9.5%),radial-gradient(circle at 55% 64%,#1119 0 5%,transparent 5.5%),linear-gradient(#a9b6bf 0%,#d5dde0 40%,#4d6d85 40.3%,#24384a 58%,#5b5446 58.3%,#3b362d 100%)}
.sc-deep{background:linear-gradient(115deg,transparent 30%,#9fd8ff22 38%,transparent 46%),linear-gradient(65deg,transparent 55%,#9fd8ff1a 62%,transparent 70%),linear-gradient(#174a73 0%,#0d2c48 50%,#071a2c 100%)}
.sc-hall{background:linear-gradient(#f6c98a 0%,#f2dcb5 45%,#c9a272 45.3%,#a8804f 100%)}
.sc-market{background:radial-gradient(circle at 15% 30%,#ffe9a8 0 6%,transparent 6.5%),radial-gradient(circle at 80% 25%,#ffd36e 0 5%,transparent 5.5%),linear-gradient(#f7d58b 0%,#f3c96a 38%,#c9884a 38.3%,#a86b35 60%,#e7c48a 60.3%,#c9a46a 100%)}
.sc-strait{background:radial-gradient(ellipse at 70% 45%,#ffffff33 0 8%,transparent 20%),linear-gradient(#7f9fb5 0%,#b5c9d4 36%,#2f6f99 36.3%,#1d4a6c 62%,#6b5a4a 62.3%,#4a3e33 100%)}
.sc-laundry{background:linear-gradient(170deg,transparent 30%,#ffffff55 30.5%,transparent 31.5%),linear-gradient(#f2a96b 0%,#f6cf96 40%,#9cbc6a 40.3%,#6e9a4a 70%,#c9a46a 70.3%,#a9854f 100%)}
.sc-sky{background:radial-gradient(ellipse at 30% 80%,#ffffffcc 0 12%,transparent 13%),radial-gradient(ellipse at 75% 85%,#ffffffbb 0 14%,transparent 15%),linear-gradient(#5d6570 0%,#8d96a3 50%,#b9c0c9 100%)}
.sc-nest{background:radial-gradient(ellipse at 50% 72%,#ffd34d55 0 6%,transparent 14%),linear-gradient(#2c2833 0%,#4a4352 45%,#3a3540 45.3%,#26232b 100%)}
.tint-shadow,.por.on.tint-shadow,.vs img.tint-shadow{filter:brightness(.25) saturate(.3) drop-shadow(0 0 6px #ffd34d)}
.tint-mirror,.por.on.tint-mirror,.vs img.tint-mirror{filter:brightness(.35) saturate(.3) hue-rotate(200deg) drop-shadow(0 0 8px #b9a0ff)}
.tint-peanut,.por.on.tint-peanut,.vs img.tint-peanut{filter:brightness(.3) sepia(.6) drop-shadow(0 0 12px #ffd34d) drop-shadow(0 0 4px #ffd34d)}
.tint-mirror-art,.por.on.tint-mirror-art,.vs img.tint-mirror-art{filter:hue-rotate(200deg) drop-shadow(0 0 8px #b9a0ff)}
.tint-peanut-art,.por.on.tint-peanut-art,.vs img.tint-peanut-art{filter:drop-shadow(0 0 12px #ffd34d) drop-shadow(0 0 4px #ffd34d)}
.por.card{height:30%;border-radius:12px}
.dbox.ally .who{align-self:flex-end;background:#3f8f6b;color:#fff}
.place{position:absolute;top:calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));left:12px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:400;letter-spacing:.05em;padding:5px 12px;border-radius:999px}
.por{position:absolute;bottom:31%;height:30%;max-width:46%;object-fit:contain;transition:filter .25s,transform .25s,opacity .25s;filter:brightness(.55) saturate(.6);opacity:.9}
.por.me{left:-3%;transform:scaleX(-1)}
.por.foe{right:-3%}
.por.foe.bossp{height:36%;max-width:52%}
.por.on{filter:none;opacity:1}
.por.me.on{transform:scaleX(-1) translateY(-6px)}
.por.foe.on{transform:translateY(-6px)}
.dbox{position:absolute;left:10px;right:10px;bottom:14px;min-height:27%;background:rgba(14,22,30,.93);border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 16px 10px;display:flex;flex-direction:column}
.dbox .who{align-self:flex-start;margin:-30px 0 6px;background:var(--gold);color:#1b1b1b;font-weight:400;font-size:18px;letter-spacing:.08em;line-height:1.2;padding:6px 14px;border-radius:10px;min-height:0;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.dbox .who:empty{display:none}
.dbox.foe .who{align-self:flex-end;background:#e07a5f;color:#fff}
.dbox.other .who{background:#6c8aa3;color:#fff}
.dbox .say{flex:1;margin:0;font-size:18px;line-height:1.7;color:#fff;word-break:keep-all}
.dbox.narr{text-align:center;justify-content:center;background:rgba(0,0,0,.78)}
.dbox.narr .say{font-size:17px;color:#f1ead8}
.dbox.tip{border-color:var(--gold)}
.dbox.tip .who{background:#2d4a33;color:#bff0c8}
.dbox.tip .say{font-size:16px}
.q{font-style:normal;color:var(--gold);font-weight:700}
.dbox .tk{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:12px;margin-top:6px}
.dbox .tk .ghost{padding:5px 10px;font-size:12px}
.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(5,10,15,.82);color:#fff;transition:opacity .6s}
.titlecard small{color:var(--gold);font-size:14px;font-weight:700}
.titlecard b{font-size:26px}
.titlecard.fade{opacity:0;pointer-events:none}
.mon.foe.boss{height:46%;right:4%;top:2%}
/* 증강체·교체 고르기 */
.sheet.pick{padding-bottom:0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
.vs .side img{height:64px;max-width:100%;object-fit:contain}
.vs .side img.flip{transform:scaleX(-1)}
.vs .side b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vs .mid{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px}
.vs .mid small{color:var(--dim);font-size:10px}
.good{color:#6fe08d}.bad{color:#ff8a7a}
.tipline{background:#1f3326;border:1px solid #2f5a3c;color:#d6f5de;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.5;margin-bottom:10px}
.aug{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;transition:border-color .15s,transform .1s}
.aug:active{transform:scale(.99)}
.aug.on{border-color:var(--gold);background:#2a2a1e}
.aug .ic{font-size:26px;width:40px;height:40px;flex:none;display:grid;place-items:center;object-fit:contain}
.aug .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.aug .tx b{font-size:15px;display:flex;align-items:center;gap:6px}
.aug .tx b em{font-style:normal;font-size:10px;background:#2f6b45;color:#d6f5de;border-radius:6px;padding:1px 6px}
.aug .tx small{color:var(--gold);font-size:11px}
.aug .tx span{color:var(--dim);font-size:12px;line-height:1.45}
.aug .ck{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#222;font-weight:900;font-size:14px}
.aug.on .ck{background:var(--gold);border-color:var(--gold)}
.hpmini{display:block;height:5px;background:#0b1218;border-radius:3px;overflow:hidden;margin-top:3px}
.hpmini i{display:block;height:100%;background:var(--hp)}
.big.wide{display:block;width:100%;position:sticky;bottom:0;margin:6px 0 0;box-shadow:0 -12px 16px var(--bg)}
.sheet.pick .big.wide{margin-bottom:16px}
/* 아래에 붙는 큰 버튼은 비활성이어도 불투명하게(뒤 카드 글자가 비쳐 겹쳐 보이지 않게) */
.big.wide:disabled{opacity:1;background:#334152;color:#8a9aab;box-shadow:0 -12px 16px var(--bg)}
.flee{align-self:flex-end;background:none;border:1px solid var(--line);border-radius:999px;color:var(--dim);font-size:13px;padding:6px 14px}
.card .syn{display:block;font-size:10px;color:var(--gold);margin-top:2px}
.foot .combo,p.combo{font-size:12px;color:#ffe9a8;text-align:center;margin:0 0 8px;line-height:1.5}
p.combo{grid-column:1/-1;margin:0}
button.mini{background:none;border:0;padding:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.mini .learn{font-style:normal;font-size:10px;font-weight:800;color:#222;background:var(--gold);border-radius:999px;padding:1px 7px;margin-top:3px;animation:pulse 1.4s infinite}
.mini small{font-size:10px;color:var(--dim);margin-top:3px}
@keyframes pulse{50%{transform:scale(1.08)}}
.who-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.who-head img{width:64px;height:64px;object-fit:contain}
.who-head b{display:block;font-size:17px}
.who-head small{color:var(--dim);font-size:12px}
.sheet h2 small{font-size:12px;color:var(--dim);font-weight:400;margin-left:4px}
.sheet h2{margin-top:12px}
.skrow{display:grid;grid-template-columns:24px auto;column-gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.skrow span{grid-row:span 2;font-size:18px}
.skrow b{font-size:14px}
.skrow small{color:var(--dim);font-size:12px}
.ghost.wide{width:100%;margin:10px 0 16px}
.combo-btn{width:100%;text-align:left;border:0;border-radius:14px;padding:10px 14px;margin-bottom:8px;background:linear-gradient(100deg,#f3c955,#f08a4b);color:#2a1a08;display:flex;flex-direction:column;gap:2px;box-shadow:0 0 14px #f3c95566}
.combo-btn:disabled{filter:grayscale(.8);opacity:.5;box-shadow:none}
.combo-btn small{font-size:11px;font-weight:700}
.combo-btn b{font-size:17px}
.combo-btn span{font-size:12px}
.comboflash{position:absolute;left:0;right:0;top:34%;padding:10px 0;background:linear-gradient(90deg,transparent,rgba(20,12,0,.72) 20%,rgba(20,12,0,.72) 80%,transparent);text-align:center;color:#fff;text-shadow:0 2px 0 #000,0 0 12px #f3c955}
.comboflash small{display:block;font-size:14px;color:#ffe9a8}
.comboflash b{font-size:28px}
.five{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,14,22,.82),rgba(0,0,0,.92));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0}
.five-line{color:#f1ead8;font-size:18px;letter-spacing:1px}
.five-line.slow{font-size:20px;color:#ffe9a8}
.five-big{font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 18px #ffd34d,0 2px 0 #000}
.stars{font-style:normal;color:#ffd34d;font-size:11px;margin-left:2px;letter-spacing:-1px}
.mini .learn.promo{background:#7ce3a0}
.need{margin:0 0 6px;font-size:12px;color:#ffb4a8}.need.ok{color:#7ce3a0}
.st-1{filter:drop-shadow(0 0 6px #ffe9a8aa)}
.st-2{filter:drop-shadow(0 0 8px #ffd34dcc) drop-shadow(0 0 2px #fff)}
.st-3{filter:drop-shadow(0 0 12px #ffd34d) drop-shadow(0 0 4px #fff) saturate(1.15)}
.promo-fx{margin:auto;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-align:center;padding:24px}
.promo-fx img{height:200px;object-fit:contain}
.promo-fx b{font-size:30px;color:#ffd34d;text-shadow:0 0 14px #ffd34d88}
.promo-fx small{color:var(--dim)}
/* 고르기 창 */
#modal{position:fixed;inset:0;background:rgba(5,10,15,.72);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px 24px;max-height:86vh;overflow:auto}
.sheet h2{font-size:17px;margin:0 0 4px}
.sheet .sub{color:var(--dim);font-size:13px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.opt.on{border-color:var(--gold)}
.opt b{display:block}
.opt span{color:var(--dim);font-size:12px}
.gtitle{display:flex;flex-direction:column;align-items:center;gap:2px;padding:28px 16px 8px;text-align:center}
.gtitle img{width:96px;height:96px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));animation:bob 2.4s ease-in-out infinite}
.gtitle b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:34px;letter-spacing:.02em;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.gtitle small{color:var(--dim);font-size:14px}
/* 대표 그림(GPT 할 일 8)이 있으면 제목 뒤에: 위쪽 하늘에 글자, 아래는 화면 바탕색으로 스며듦 */
.gtitle.art{position:relative;aspect-ratio:2/1;max-height:340px;justify-content:flex-start;padding-top:18px;margin:0 0 6px;background:center top/cover no-repeat;border-radius:0 0 22px 22px;overflow:hidden}
.gtitle.art::after{content:"";position:absolute;inset:auto 0 0;height:28%;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.gtitle.art::before{content:"";position:absolute;inset:0 0 auto;height:48%;background:linear-gradient(rgba(12,45,85,.45),transparent);pointer-events:none}
.gtitle.art>*{position:relative;z-index:1}
.gtitle.art img{display:none}
.gtitle.art b{color:#fff;font-size:38px;text-shadow:0 3px 0 #164b80,0 0 18px rgba(10,40,80,.45)}
.gtitle.art small{color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 2px #0c2d55,0 0 8px rgba(10,40,80,.8)}
@keyframes bob{50%{transform:translateY(-6px)}}
.gmenu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px 24px}
.gmenu a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:inherit;text-decoration:none;font-size:14px}
.gmenu a i{font-style:normal;font-size:24px}
.cont{margin:6px 16px 4px;border-radius:18px;overflow:hidden;position:relative;min-height:190px;display:flex;align-items:flex-end;box-shadow:0 8px 24px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15)}
.cont .in,.chead .in{position:relative;width:100%;padding:14px 16px;background:linear-gradient(transparent,rgba(10,14,20,.88) 38%)}
.cont small,.chead small{color:#ffd77a;font-size:13px}
.cont b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:24px;color:#fff;margin:2px 0 4px;letter-spacing:.02em}
.cont p,.chead p{margin:0 0 8px;color:#e8e2d6;font-size:14px;line-height:1.55}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--gold);border-radius:99px}
.pn{font-size:12px;color:#cfd6df}
.cont .big{width:100%;margin-top:10px}
.chead{border-radius:16px;overflow:hidden;margin:12px 0 6px;min-height:120px;display:flex;align-items:flex-end;border:1px solid rgba(255,255,255,.12)}
.chead h2{display:inline-block;margin:0 8px 4px 0;font-size:20px;color:#fff}
.chap details>summary{cursor:pointer;color:var(--dim);font-size:13px;padding:4px 2px 8px;list-style:none}.chap details>summary::before{content:'▸ '}.chap details[open]>summary::before{content:'▾ '}
.mute{position:fixed;top:calc(10px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));right:10px;z-index:60;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);font-size:18px;line-height:1;cursor:pointer}

/* ── 첫 화면(게임 타이틀) ── */
.ts{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:0 0 calc(14px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));background:#0b1622 center/cover no-repeat}
.ts::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(6,14,24,.55),rgba(6,12,20,.86) 45%,#0a1119);pointer-events:none}
.ts>*{position:relative}
.hero{aspect-ratio:1.45/1;max-height:52vh;background:center 55%/cover no-repeat;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);display:flex;flex-direction:column;align-items:center;padding-top:calc(10px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)))}
.hero.noart{aspect-ratio:auto;min-height:200px;-webkit-mask-image:none;mask-image:none}
.hero .badge{align-self:flex-start;margin-left:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(6,20,40,.6);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:13px;padding:4px 12px 4px 4px;border-radius:999px;text-decoration:none;backdrop-filter:blur(4px)}
.hero .badge img{width:22px;height:22px}
.hero .badge.out{padding:5px 12px;color:#ffe9a8}
.logo{display:flex;flex-direction:column;align-items:center;margin-top:8px;animation:bob 3s ease-in-out infinite}
.logo b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(34px,11vw,52px);line-height:1.05;color:#fff;letter-spacing:.02em;-webkit-text-stroke:1.5px #0c2d55;text-shadow:0 4px 0 #0c2d55,0 7px 0 rgba(0,0,0,.35),0 0 24px rgba(255,220,120,.45)}
.logo small{margin-top:6px;font-size:13px;font-weight:700;color:#3a2600;background:linear-gradient(#ffe58a,#e9b43a);padding:3px 14px;border-radius:999px;box-shadow:0 2px 0 #9a6a10;letter-spacing:.1em}
.tmid{margin-top:-24px;display:flex;flex-direction:column;gap:12px}
.now{margin:0 20px;text-align:center}
.now small{color:#ffd77a;font-size:13px;letter-spacing:.04em}
.now b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:24px;color:#fff;margin:2px 0 8px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.now .need{margin:0 0 8px;font-size:13px;color:#ffb4a8}
.now .prog{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:visible;margin:0 30px 0 0}
.now .prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffe58a,#e9b43a)}
.now .prog em{position:absolute;right:-32px;top:-5px;font-style:normal;font-size:12px;color:var(--dim)}
.play{margin:4px 20px 0;border:0;border-radius:20px;padding:18px 12px;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:26px;letter-spacing:.04em;color:#3a2200;background:linear-gradient(#ffeaa0,#f2c14e 55%,#d99a22);box-shadow:0 6px 0 #9a6410,0 10px 24px rgba(242,193,78,.35),inset 0 2px 0 rgba(255,255,255,.7);position:relative;overflow:hidden;animation:pulse 2.2s ease-in-out infinite}
.play::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3s ease-in-out infinite}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #9a6410}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes shine{0%,55%{left:-60%}85%,100%{left:130%}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 20px 0}
.two button{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,220,140,.35);border-radius:16px;padding:14px 8px;background:linear-gradient(rgba(40,64,92,.85),rgba(20,34,52,.9));color:#fff;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.two button i{font-style:normal;font-size:22px}
.two button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.squad{flex:1;min-height:90px;display:flex;align-items:flex-end;justify-content:center;gap:2%;padding:4px 16px 0;position:relative}
.squad::before{content:"";position:absolute;left:12%;right:12%;bottom:-6px;height:28px;border-radius:50%;background:radial-gradient(rgba(255,215,120,.35),transparent 70%)}
.squad img{height:clamp(70px, calc(100dvh - 700px), 200px);max-width:32%;object-fit:contain;object-position:50% 100%;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.squad img:nth-child(2){height:clamp(80px, calc(100dvh - 680px), 220px)}
.squad.empty{align-items:center;color:var(--dim);font-size:13px}
.dock{margin:0 12px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:10px 6px 8px;border-radius:20px;background:rgba(8,16,26,.75);border:1px solid rgba(255,255,255,.1)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#e8e2d6;font-size:11px}
.dock a i{font-style:normal;font-size:22px;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3c5878,#1a2a3e);border:2px solid #c9a24a;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.dock a:active i{transform:translateY(2px)}

/* 능력치 표·물리/마법 표시 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 4px}
.stats div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}
.stats small{color:var(--dim);font-size:11px}
.stats b{font-size:18px;font-family:"Black Han Sans",sans-serif;font-weight:400}
.stats .main{border-color:var(--gold)}.stats .main b{color:var(--gold)}
i.cat{font-style:normal;font-size:10px;padding:1px 6px;border-radius:999px;margin:0 4px;vertical-align:2px;font-weight:700}
i.cat.phys{background:#5a3a22;color:#ffd9b0}i.cat.mag{background:#3a2d66;color:#d9ccff}

/* ── 가로 화면(앱은 가로 고정, 웹도 화면이 가로면) ── */
@media (orientation:landscape) and (max-height:600px), (orientation:landscape) and (min-width:900px){
  #app{max-width:none}
  /* 첫 화면: 대표 그림 전체 + 위 가운데 제목, 아래 왼쪽 이어하기·오른쪽 메뉴 */
  .ts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr auto;gap:10px 18px;padding:0 calc(18px + var(--safe-area-inset-right, env(safe-area-inset-right, 0px))) calc(12px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))) calc(18px + var(--safe-area-inset-left, env(safe-area-inset-left, 0px)));background-image:var(--key) !important;background-position:center 40%}
  .ts::before{background:linear-gradient(rgba(6,20,40,.35),transparent 30%,transparent 50%,rgba(6,12,20,.82) 82%)}
  .hero{grid-column:1/3;aspect-ratio:auto;max-height:none;background:none !important;-webkit-mask-image:none;mask-image:none;padding-top:calc(8px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)))}
  .hero .badge{margin-left:0}
  .logo b{font-size:clamp(34px,6vw,64px)}
  .squad{display:none}
  .tmid{grid-column:1;grid-row:2;margin:0;gap:8px;align-self:end}
  .now{margin:0;text-align:left}
  .now b{font-size:20px;margin:0 0 6px}
  .play{margin:2px 0 0;padding:12px;font-size:22px}
  .two{margin:2px 0 0}.two button{padding:10px 8px;font-size:16px}
  .dock{grid-column:2;grid-row:2;align-self:end;margin:0}
  .dock a i{width:52px;height:52px;font-size:24px}
  /* 전투: 왼쪽 장면, 오른쪽 알림·기술 */
  #app:has(#arena){display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh;min-height:0;overflow:hidden}
  #app:has(#arena) #arena{grid-row:1/3;height:100%;aspect-ratio:auto}
  #app:has(#arena) #msg{margin:10px 12px 6px;min-height:0;padding:8px 12px;font-size:13px}
  #app:has(#arena) #panel{overflow:auto;padding:0 12px calc(12px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));gap:6px}
  #app:has(#arena) .sk{padding:6px 9px}
  #app:has(#arena) .sk p{display:none}
  /* 대사: 화면 전체, 인물 크게, 대사창은 아래 가운데 */
  .scene{max-width:none}
  .por{height:62%;bottom:4%;max-width:34%}
  .por.foe.bossp{height:72%;max-width:40%}
  .por.me{left:2%}.por.foe{right:2%}
  .dbox{left:22%;right:22%;min-height:0;bottom:12px;padding:12px 16px 8px}
  /* 아래에서 올라오는 창: 가로 화면에선 넓고 높게, 고르는 카드는 3칸씩 가로로 */
  .sheet{max-height:96vh;max-width:min(980px,96vw)}
  .sheet.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start}
  .sheet.pick>*:not(.aug){grid-column:1/-1}
  .sheet.pick>.aug{margin:0;flex-direction:column;align-items:flex-start;position:relative}
  .sheet.pick>.aug .ck{position:absolute;top:8px;right:8px}
  .sheet.pick .vs{grid-template-columns:1fr auto 1fr;padding:6px}
  .sheet.pick .vs .side img{display:none}
  .sheet.pick .vs .side{flex-direction:row;gap:6px;justify-content:center}
  .sheet.pick .vs .mid{flex-direction:row;gap:6px;align-items:center}
  .sheet.pick .tipline{margin:0;padding:6px 10px;font-size:12px}
  .stats{grid-template-columns:repeat(6,minmax(0,1fr))}
  .sheet.pick h2{margin:4px 0 0}
}

/* ════ 색 규칙(docs/UI-COLOR.md). 이 덩어리를 지우면 예전 남색 테마로 돌아감 ════
   1) 바탕·칸 = 그림의 크림 돌·갈색 선(중립)  2) 주요 행동 하나 = 캐러멜(그림과 같은 따뜻한 계열, 크기·두께로 강조, 흰 글자 대비 5.47 — v0.9.93)
   3) 보조 행동 = 크림 종이 버튼(색 없이 테두리)  4) 금빛 = 진행·보상만  5) 초록·빨강 = 유리·불리·체력 같은 정보만 */
:root{--bg:#efdcb6;--panel:#fff7e4;--line:#d9b98a;--ink:#3b2614;--dim:#7d5f40;--gold:#e9a630;--edge:#7a4e2a;--card:#fffaf0;
  --accent:#dd9a58;--accent-hi:#f0bd85;--accent-d:#7a4e2a;--accent-soft:#fbe8d3;--on-accent:#3b2614}
html,body{background:#efdcb6 radial-gradient(rgba(122,78,42,.10) 1px,transparent 1.3px) 0 0/18px 18px;color:var(--ink)}
header h1,header small,.chap h2{color:var(--ink)}
/* 종이 칸 */
.sk,.aug,.mini,.card,.stage,.ghost,.sw button,.opt,.skrow,.stats div,.combo-btn,.cont,.chead,.teambar .ghost{background:var(--card);border:2px solid var(--line);color:var(--ink);box-shadow:0 3px 0 rgba(122,78,42,.25)}
.sk{border-top:6px solid var(--c,#c9a46a)}
.sk .kd,.sk p,.sk .ln small,.aug .tx span,.aug .tx small,.skrow small,.stats small,.stage .tt small,.mini small,.hint,.sheet .sub{color:var(--dim)}
.sk:disabled{opacity:.5}
/* 고른 것 = 캐러멜 테두리(주요 행동과 같은 색 → "이걸로 할게"가 한눈에) */
.aug.on,.card.on,.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent-d)}
.aug .ck{border-color:var(--line)}.aug.on .ck{background:var(--accent);border-color:var(--accent-d);color:var(--on-accent)}
/* 주요 행동(화면마다 하나): 캐러멜 */
.big{background:linear-gradient(var(--accent-hi),var(--accent));color:var(--on-accent);border:2px solid var(--accent-d);box-shadow:0 4px 0 var(--accent-d);text-shadow:0 1px 0 rgba(255,240,215,.6);border-radius:14px}
.big:disabled{background:#e6d7bb;border-color:#c9b08a;box-shadow:0 3px 0 #c9b08a;color:#9b8466;text-shadow:none;opacity:1}
.big.wide:disabled{background:#e6d7bb;color:#9b8466;box-shadow:0 -10px 14px var(--bg)}
.big.wide{box-shadow:0 4px 0 var(--accent-d),0 -10px 14px var(--bg)}
.sheet{background:var(--bg) radial-gradient(rgba(122,78,42,.08) 1px,transparent 1.3px) 0 0/18px 18px;border-top:3px solid var(--edge)}
#modal{background:rgba(40,22,8,.55)}
/* 전투 */
.box{background:rgba(255,248,232,.94);border:2px solid var(--edge);color:var(--ink);box-shadow:0 3px 0 rgba(60,35,15,.35)}
.box .nm em{color:var(--dim)}.box .row small{color:var(--dim)}
.hpb{background:#e3cfa9;border:1px solid #b8975c}
#msg{background:var(--card);border:2px solid var(--edge);color:var(--ink);border-radius:14px;box-shadow:0 3px 0 rgba(122,78,42,.3)}
.augs{color:#8a5a12}
.flee{background:transparent;border:1.5px dashed var(--line);color:var(--dim);box-shadow:none}
.plat{background:radial-gradient(ellipse,rgba(110,72,36,.45) 0%,rgba(110,72,36,.22) 45%,rgba(110,72,36,0) 70%)}
/* 대사 */
.dbox{background:rgba(255,247,228,.96);border:3px solid var(--edge);color:var(--ink);box-shadow:0 4px 0 rgba(60,35,15,.4)}
.dbox .say{color:var(--ink)}
.dbox .tk .ghost{background:transparent;border:1.5px solid var(--line);box-shadow:none;color:var(--dim)}
.dbox .who{border:2px solid var(--edge);box-shadow:0 2px 0 rgba(60,35,15,.4)}
.dbox.narr{background:rgba(255,247,228,.97)}
.dbox.narr .say{color:var(--ink)}
.dbox.tip .who{background:#dff0d6;color:#2c4a22}
.dbox{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.place,.mute{background:rgba(255,247,228,.92);color:var(--ink);border:2px solid var(--edge)}
/* 물리·마법은 색 대신 기호(정보 표시가 버튼 색과 겨루지 않게) */
i.cat{background:transparent !important;border:1.5px solid var(--line);color:var(--dim) !important;font-weight:700}
i.cat.phys::before{content:"⚔ "}i.cat.mag::before{content:"✦ "}
.stats .main{border-color:var(--accent-d)}.stats .main b{color:var(--accent-d)}
.xp{background:#e3cfa9}.need{color:#a8431c}
/* 첫 화면: 주요 행동은 「이어하기」 하나만 캐러멜, 나머지는 종이 */
.ts::before{background:linear-gradient(rgba(255,240,210,.12),rgba(80,45,15,.12) 45%,rgba(60,32,10,.62))}
.hero .badge{background:rgba(255,247,228,.92);color:var(--ink);border:2px solid var(--edge)}
.hero .badge.out{color:#7a4e2a}
.logo b{color:#fff6dc;-webkit-text-stroke:2px #5a3416;text-shadow:0 4px 0 #5a3416,0 7px 0 rgba(0,0,0,.25),0 0 22px rgba(255,200,90,.6)}
.logo small{color:#5a3416;background:#fff3d6;box-shadow:0 2px 0 #5a3416;border:2px solid #5a3416}
.now{background:rgba(255,247,228,.94);border:2.5px solid var(--edge);border-radius:14px;padding:8px 12px 10px;box-shadow:0 3px 0 rgba(60,35,15,.4)}
.now small{color:#8a5a12;font-weight:700}
.now b{color:var(--ink);text-shadow:none}
.now .prog{background:#ead6ae;border:1.5px solid #c4a274}.now .prog i{background:linear-gradient(90deg,#ffd27a,var(--gold))}
.now .prog em{color:var(--dim);text-shadow:none}
.play{color:var(--on-accent);background:linear-gradient(var(--accent-hi),var(--accent) 55%,#c98443);border:3px solid var(--accent-d);box-shadow:0 6px 0 var(--accent-d),0 10px 24px rgba(122,78,42,.3),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 1px 0 rgba(255,240,215,.6)}
.two button{background:rgba(255,250,240,.96);border:2.5px solid var(--edge);box-shadow:0 4px 0 rgba(90,52,22,.55);color:var(--ink);text-shadow:none}
.dock{background:rgba(255,247,228,.92);border:3px solid var(--edge);box-shadow:0 4px 0 rgba(60,35,15,.4)}
.dock a{color:var(--ink);font-weight:700}
.dock a i{background:radial-gradient(circle at 35% 30%,#fffdf5,#f6e2b8);border:2.5px solid var(--edge);box-shadow:0 3px 0 rgba(90,52,22,.45)}
/* 그림 위 글씨는 흰색 유지, 크림 바탕 위 연한 글씨는 진하게 */
.chead h2,.cont b{color:#fff;text-shadow:0 2px 0 rgba(40,22,8,.8)}
.chead p,.cont p{color:#fff3dc}
.foot .combo,p.combo{color:#a5560f}
.good{color:#1f8a46}.bad{color:#c53b25}
.tipline{background:#e6f4dc;border:2px solid #9cc98a;color:#2c4a22}
.box .good{color:#1f8a46}
.vs{background:var(--card);border:2px solid var(--line)}
.vs .mid small{color:var(--dim)}
@media (orientation:landscape) and (max-height:600px), (orientation:landscape) and (min-width:900px){
  #app:has(#arena) #panel,#app:has(#arena){background:transparent}
}

/* ════ 움직이는 배경·숨쉬기 ════ */
.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#arena>*:not(.amb){z-index:1}
.amb i{position:absolute;left:var(--x);top:var(--y);display:block;animation-delay:var(--dl) !important}
/* 구름: 하늘 띠에서 왼→오른쪽으로 천천히 */
.a-cloud{top:calc(var(--y) * .3) !important;width:calc(120px * var(--s));height:calc(36px * var(--s));border-radius:999px;background:radial-gradient(ellipse at 50% 60%,#fffffff0 30%,#ffffff00 70%);filter:blur(1px);opacity:.85;animation:drift calc(var(--d) * 4) linear infinite}
.a-cloud::before,.a-cloud::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(#fffffff0 40%,#fff0 70%)}
.a-cloud::before{width:55%;height:120%;left:15%;top:-55%}.a-cloud::after{width:40%;height:95%;left:48%;top:-35%}
@keyframes drift{from{transform:translateX(-140%)}to{transform:translateX(110vw)}}
/* 갈매기: 하늘을 가로질러 날갯짓 */
.a-gull{top:calc(5% + var(--y) * .25) !important;width:calc(18px * var(--s));height:calc(8px * var(--s));animation:fly calc(var(--d) * 1.6) linear infinite}
.a-gull::before,.a-gull::after{content:"";position:absolute;top:0;width:50%;height:100%;border-top:2px solid #3b3a44;border-radius:60% 60% 0 0;animation:flap .5s ease-in-out infinite alternate}
.a-gull::before{left:0;transform-origin:100% 100%}.a-gull::after{right:0;transform-origin:0 100%}
@keyframes fly{from{transform:translate(-30vw,0)}50%{transform:translate(40vw,-12px)}to{transform:translate(120vw,4px)}}
@keyframes flap{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
.a-gull::after{animation-direction:alternate-reverse}
/* 물 반짝임: 바다 띠에서 깜빡 */
.a-glint{top:calc(40% + var(--y) * .18) !important;width:calc(14px * var(--s));height:2px;border-radius:2px;background:#fffffff0;box-shadow:0 0 6px #fff;animation:twinkle calc(var(--d) * .25) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scaleX(.3)}50%{opacity:1;transform:scaleX(1)}}
/* 먹물 방울·종이 */
.a-drop{width:calc(7px * var(--s));height:calc(10px * var(--s));border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#16121c;opacity:.75;animation:fall calc(var(--d) * .5) linear infinite}
.a-paper{width:calc(16px * var(--s));height:calc(20px * var(--s));background:#f3ead8;border:1px solid #b9ab92;box-shadow:inset 3px 4px 0 -1px #1a1a1a55;animation:flutter calc(var(--d) * 1.2) linear infinite}
@keyframes fall{from{transform:translateY(-120%) }to{transform:translateY(110vh)}}
@keyframes flutter{0%{transform:translate(0,-20vh) rotate(0)}25%{transform:translate(4vw,10vh) rotate(90deg)}50%{transform:translate(-3vw,40vh) rotate(160deg)}75%{transform:translate(5vw,70vh) rotate(250deg)}100%{transform:translate(0,110vh) rotate(360deg)}}
/* 거품·물빛 */
.a-bubble{top:100% !important;width:calc(10px * var(--s));height:calc(10px * var(--s));border-radius:50%;border:1.5px solid #cfefffcc;background:radial-gradient(circle at 30% 30%,#ffffffaa 0 18%,transparent 30%);animation:rise calc(var(--d) * .6) ease-in infinite}
@keyframes rise{from{transform:translate(0,0)}50%{transform:translate(8px,-55vh)}to{transform:translate(-6px,-115vh)}}
.a-ray{top:-10% !important;width:calc(60px * var(--s));height:130%;background:linear-gradient(#bfe8ff33,#bfe8ff00);transform-origin:50% 0;animation:sway calc(var(--d) * .8) ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
/* 금가루·불티 */
.a-dust{width:calc(4px * var(--s));height:calc(4px * var(--s));border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px #ffd34d;animation:twinkle calc(var(--d) * .3) ease-in-out infinite}
.a-ember{top:100% !important;width:calc(4px * var(--s));height:calc(4px * var(--s));border-radius:50%;background:#ffd34d;box-shadow:0 0 8px 3px #ffb12aaa;animation:rise calc(var(--d) * .5) ease-out infinite}
/* 물보라·천 조각·검은 깃털 */
.a-spray{top:calc(36% + var(--y) * .25) !important;width:calc(6px * var(--s));height:calc(6px * var(--s));border-radius:50%;background:#ffffffd0;animation:splash calc(var(--d) * .2) ease-out infinite}
@keyframes splash{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(14px,-30px);opacity:0}}
.a-cloth{width:calc(14px * var(--s));height:calc(10px * var(--s));border-radius:3px;background:#fffaf0;box-shadow:inset 0 -2px 0 #e8d9bd;animation:flutter calc(var(--d) * 1.4) linear infinite}
.a-feather2{width:calc(8px * var(--s));height:calc(18px * var(--s));border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(#2a2730,#0f0d12);animation:flutter calc(var(--d) * 1.1) linear infinite}
/* 대사·첫 화면 그림: 아주 천천히 확대·이동 */
.kb{position:absolute;inset:-4%;background-size:cover !important;animation:kb 40s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-2%,-1%)}}
.scene>.amb,.scene>.kb{z-index:0}.scene>*:not(.amb):not(.kb){z-index:1}
.ts>.amb{z-index:0}
/* 숨쉬기: 서 있는 캐릭터가 살짝 늘었다 줄었다(공격·맞는 움직임과 겹쳐도 되게 scale 속성만) */
.mon,.por{animation:breathe 2.8s ease-in-out infinite}
.mon.foe,.por.foe{animation-duration:3.3s}
@keyframes breathe{0%,100%{scale:1 1}50%{scale:1.015 1.03}}
@media (prefers-reduced-motion:reduce){.amb,.kb{display:none}.mon,.por,.ts,.logo,.play,.squad img{animation:none !important}}

/* ════ 게임 첫 화면(로그인 화면) ════ */
.title{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(6vh + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 16px calc(7vh + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));background:#7fb7e0 center 40%/cover no-repeat;overflow:hidden}
.title::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,240,200,.35),transparent 60%),linear-gradient(transparent 55%,rgba(50,28,8,.55));pointer-events:none;z-index:0}
.title>*:not(.amb){position:relative;z-index:1}
/* 게임 이름: 두꺼운 갈색 테두리 + 크림→금빛 글자 + 빛, 천천히 둥실 */
.tlogo{display:flex;flex-direction:column;align-items:center;animation:bob 3.2s ease-in-out infinite}
.tlogo b{position:relative;display:grid;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(44px,8.5vw,96px);line-height:1.1;letter-spacing:.02em;white-space:nowrap}
/* 두 층을 같은 자리에 겹침: 뒤 = 두꺼운 갈색 테두리·그림자, 앞 = 크림→금빛 글자 */
.tlogo b span{grid-area:1/1}
.tlogo .stroke{color:#4a2a10;-webkit-text-stroke:clamp(9px,1.5vw,15px) #4a2a10;text-shadow:0 7px 0 #4a2a10,0 12px 18px rgba(40,20,5,.45)}
.tlogo .fill{background:linear-gradient(#fffcef 0%,#ffeeb3 40%,#f7c24c 72%,#e8922a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tlogo small{margin-top:12px;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(15px,2vw,21px);letter-spacing:.12em;color:#4a2a10;background:#fff3d6;padding:4px 18px;border-radius:999px;border:3px solid #4a2a10;box-shadow:0 3px 0 #4a2a10}
.tgo{display:inline-block;text-decoration:none;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(22px,3vw,30px);letter-spacing:.06em;color:#fff;padding:14px 56px;border-radius:999px;
  background:linear-gradient(var(--accent-hi),var(--accent) 55%,#c98443);color:var(--on-accent);border:3px solid var(--accent-d);box-shadow:0 6px 0 var(--accent-d),0 10px 30px rgba(80,35,8,.35);text-shadow:0 1px 0 rgba(255,240,215,.6);animation:pulse 2.2s ease-in-out infinite}
.tacc{position:absolute !important;bottom:calc(14px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));left:14px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,247,228,.92);color:var(--ink);border:2px solid var(--edge,#7a4e2a);font-size:13px;padding:4px 12px 4px 4px;border-radius:999px}
.tacc img{width:22px;height:22px}

/* ════ 전투 원근감: 내 갈매미 = 카메라 앞(크게·아래 잘림), 상대 = 지평선 근처(작게·뿌옇게) ════ */
#arena{--hz:58.3%}
#arena.sc-hall,#arena.sc-nest{--hz:45.3%}#arena.sc-market{--hz:38.3%}#arena.sc-strait{--hz:62.3%}#arena.sc-laundry{--hz:40.3%}#arena.sc-ink{--hz:58.3%}
#arena.sc-deep,#arena.sc-sky{--hz:62%}
/* 땅: 소실점으로 모이는 줄(멀수록 촘촘) */
#arena .ground{position:absolute;left:-60%;right:-60%;top:var(--hz);height:120%;transform:perspective(260px) rotateX(62deg);transform-origin:50% 0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(90,55,25,.16) 0 2px,transparent 2px 9%),repeating-linear-gradient(0deg,rgba(90,55,25,.12) 0 2px,transparent 2px 70px);
  -webkit-mask-image:linear-gradient(transparent,#000 12%);mask-image:linear-gradient(transparent,#000 12%)}
#arena.sc-deep .ground,#arena.sc-sky .ground{display:none}
/* 지평선 근처 공기(멀리 있는 것이 뿌옇게) */
#arena .haze{position:absolute;left:0;right:0;top:calc(var(--hz) - 14%);height:22%;background:linear-gradient(transparent,rgba(255,250,235,.28) 55%,transparent);pointer-events:none}
/* 상대: 작게, 지평선 바로 아래에 발 */
.mon.foe{height:30%;right:13%;top:calc(var(--hz) - 23%)}
.mon.foe.boss{height:38%;right:9%;top:calc(var(--hz) - 31%)}
.mon.foe:not([class*="tint-"]){filter:saturate(.9) brightness(1.04) drop-shadow(0 3px 2px rgba(0,0,0,.15))}
/* 내 갈매미: 크게, 화면 아래로 살짝 잘림 */
.mon.me{height:66%;left:0;bottom:-7%}
/* 그림자: 가까운 쪽 크고 진하게, 먼 쪽 작고 옅게 */
.plat{background:radial-gradient(ellipse,rgba(60,35,15,.42) 0%,rgba(60,35,15,.18) 45%,rgba(60,35,15,0) 70%) !important}
.plat.foe{width:26%;height:7%;right:15%;top:calc(var(--hz) + 3.5%)}
.plat.me{width:62%;height:16%;left:-6%;bottom:-6%}

/* 검토 반영: 세로 첫 화면은 갈매미 쪽을 보여 줌, 세로 전투는 내 갈매미를 조금 작게(상태 칸에 안 가리게) */
@media (orientation:portrait){.title{background-position:22% 50%}.mon.me{height:52%;left:-2%;bottom:-4%}.plat.me{width:52%}}
/* 로비: 게임 이름을 뺀 만큼 대표 그림 영역을 낮게 */
.ts .hero{min-height:0}

/* ════ 검토 반영(v0.9.88) ════ */
/* 첫 화면: 버튼을 아래 부두 쪽에, 게임 이름과 같은 크림·갈색 팻말로(그림과 한 세트). 아래는 땅처럼 어둡게 */
.title{justify-content:space-between}
.title::before{background:radial-gradient(ellipse at 50% 22%,rgba(255,240,200,.3),transparent 55%),linear-gradient(transparent 62%,rgba(45,25,8,.35) 78%,rgba(35,18,5,.72))}
.tgo{font-size:clamp(20px,2.6vw,28px);padding:10px 44px;color:#4a2a10;letter-spacing:.08em;text-shadow:none;
  background:linear-gradient(#fffaf0,#f6dfae);border:3px solid #4a2a10;box-shadow:0 5px 0 #4a2a10,0 10px 24px rgba(30,15,5,.5);animation:none}
.tgo:active{transform:translateY(4px);box-shadow:0 1px 0 #4a2a10}
.title .tgo{position:relative}
/* 로비: 배경 그림을 흐리고 어둡게 → 칸이 그림 앞에 놓인 느낌 */
.lbg{position:absolute;inset:-20px;z-index:0 !important;background:var(--key) center 40%/cover no-repeat;filter:blur(7px) saturate(.85) brightness(.72);pointer-events:none}
.ts{background-image:none !important;background-color:#3b2614;overflow:hidden}
.ts::before{z-index:0;background:linear-gradient(rgba(40,22,8,.15),rgba(40,22,8,.35)) !important}
.ts>*:not(.lbg){z-index:1}
@media (orientation:landscape) and (max-height:600px), (orientation:landscape) and (min-width:900px){
  .ts{background-image:none !important}
  /* 로비 가로(v0.9.91): 비어 있던 위쪽(제목이 첫 화면으로 옮겨 간 자리)을 없애고
     왼쪽 = 지금 이야기·이어하기, 오른쪽 = 내 수비대 셋(크게) + 아래 메뉴 */
  .ts{grid-template-rows:minmax(0,1fr) auto;padding-top:calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)))}
  .hero{display:none}
  .tmid{grid-column:1;grid-row:1/3;align-self:center}
  .squad{display:flex;grid-column:2;grid-row:1;min-height:0;align-items:flex-end;padding:0 4px 6px;margin-right:56px}
  .squad img{height:min(44vh,230px);max-width:33%}
  .squad img:nth-child(2){height:min(50vh,260px)}
  .squad.empty{align-items:center}
  .squad.empty span{background:rgba(255,250,240,.92);color:var(--ink);border:2px solid var(--edge);border-radius:14px;padding:10px 16px;font-size:15px}
}

/* 앱 전체 화면(v0.9.89): 노치·둥근 모서리 피하기. 그림은 끝까지, 버튼·글자만 안쪽으로 */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
.place{left:calc(12px + var(--sl))}
.mute{right:calc(10px + var(--sr))}
.tacc{left:calc(14px + var(--sl))}
.hero .badge{margin-left:calc(12px + var(--sl))}
.box.foe{left:calc(3% + var(--sl))}
@media (orientation:landscape) and (max-height:600px), (orientation:landscape) and (min-width:900px){
  #app:has(#arena) #panel{padding-right:calc(12px + var(--sr))}
  #app:has(#arena) #msg{margin-right:calc(62px + var(--sr))}
}
#app:has(.chap),#app:has(.grid){padding-left:var(--sl);padding-right:var(--sr)}
.sheet{padding-left:calc(16px + var(--sl));padding-right:calc(16px + var(--sr))}

/* ════ 첫 화면 v0.9.90: 제목 글꼴·움직이는 배경·오른쪽 아래 계정+설정 ════ */
.title{background:#7fb7e0}
.title>.tbg{position:absolute !important;inset:-6%;z-index:0 !important;background:center 40%/cover no-repeat;animation:tcam 38s ease-in-out infinite alternate;will-change:transform}
@keyframes tcam{0%{transform:scale(1) translate(0,0)}50%{transform:scale(1.07) translate(-2.2%,-1%)}100%{transform:scale(1.04) translate(1.8%,.6%)}}
/* 빛 줄기: 대각선 햇빛이 천천히 지나감 */
.title>.tray{position:absolute !important;inset:0;z-index:0 !important;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(105deg,transparent 30%,rgba(255,245,210,.0) 38%,rgba(255,240,200,.55) 46%,rgba(255,245,210,0) 54%,transparent 62%) 0 0/260% 100% no-repeat;animation:tray 11s ease-in-out infinite}
@keyframes tray{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.title>.amb{z-index:0 !important}
/* 제목: 둥글고 두꺼운 게임 글꼴(Bagel Fat One) */
.tlogo b{font-family:"Bagel Fat One","Black Han Sans",sans-serif;font-size:clamp(44px,8.8vw,104px);letter-spacing:.01em}
.tlogo .stroke{-webkit-text-stroke:clamp(10px,1.6vw,16px) #4a2a10}
/* 부제: 버튼처럼 보이지 않게 글자만 */
.tlogo .tsub{margin-top:6px;background:none !important;border:0 !important;box-shadow:none !important;padding:0 !important;
  font-family:"Black Han Sans",sans-serif;font-size:clamp(16px,2.2vw,24px);letter-spacing:.35em;color:#fff7e0;
  text-shadow:0 2px 0 #4a2a10,0 0 2px #4a2a10,0 0 12px rgba(40,20,5,.65)}
/* 오른쪽 아래: 계정 이름 + ⚙ */
.tcorner{position:absolute !important;right:calc(14px + var(--sr,0px));bottom:calc(14px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));display:flex;align-items:center;gap:8px}
.tcorner .tacc{position:static !important;display:inline-block;padding:6px 14px;font-size:14px;color:#4a2a10;background:rgba(255,247,228,.92);border:2px solid #4a2a10;border-radius:999px}
.tset,.mute{width:46px;height:46px;border-radius:50%;border:2.5px solid #4a2a10;background:radial-gradient(circle at 35% 30%,#fffdf5,#f1d9a8);color:#4a2a10;font-size:24px;line-height:1;box-shadow:0 3px 0 #4a2a10;cursor:pointer;display:grid;place-items:center;padding:0}
.tset:active,.mute:active{transform:translateY(2px);box-shadow:0 1px 0 #4a2a10}
/* 반짝이(위로 천천히)·흰 깃털 */
.a-mote{top:100% !important;width:calc(5px * var(--s));height:calc(5px * var(--s));border-radius:50%;background:#fff6d0;box-shadow:0 0 10px 3px rgba(255,220,130,.8);animation:rise calc(var(--d) * .9) ease-in-out infinite}
.a-wfeather{width:calc(9px * var(--s));height:calc(20px * var(--s));border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(#ffffff,#e9e1cf);box-shadow:0 0 4px rgba(255,255,255,.8);animation:flutter calc(var(--d) * 1.3) linear infinite}
/* 설정 창 */
.sheet.set{max-width:min(520px,94vw)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.setrow .ghost{padding:8px 14px}
.tog{min-width:72px;padding:8px 12px;border-radius:999px;border:2px solid var(--edge);background:#e6d7bb;color:var(--dim);font-weight:700}
.tog.on{background:var(--accent);border-color:var(--accent-d);color:var(--on-accent)}
.setrow.coup input{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;font:inherit}
.coupmsg{white-space:pre-line;margin:4px 2px 8px;padding:8px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:14px}
.setdel{margin:8px 0;padding:8px 12px;border:1.5px dashed var(--line);border-radius:14px;color:var(--dim)}
.setdel summary{cursor:pointer;font-weight:700}
.setdel input{width:100%;margin:6px 0;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);font:inherit}
.setdel .big{background:linear-gradient(#e25c4a,#c53b25);border-color:#7a1f12;box-shadow:0 4px 0 #7a1f12}
.setdel .big:disabled{background:#e6d7bb;border-color:#c9b08a;box-shadow:0 3px 0 #c9b08a}
.sheet.set .ghost.wide{margin-top:8px}
/* 가로(높이 낮음): 설정 창이 화면 밖으로 잘리지 않게 가운데에 촘촘히 */
@media (orientation:landscape) and (max-height:600px){
  #modal:has(.sheet.set){align-items:center}
  .sheet.set{border-radius:18px;border:3px solid var(--edge);max-height:calc(100dvh - 16px);padding-top:10px;padding-bottom:10px}
  .sheet.set h2{margin:0 0 2px}
  .sheet.set .setrow{padding:6px 12px;margin:6px 0}
  .sheet.set .setdel{margin:6px 0;padding:6px 12px}
  .sheet.set .ghost.wide{margin-top:4px;padding:8px}
}

/* ── 전투 증강체: 화면 전체 + 칸마다 다시 뽑기 1번(v0.9.91) ── */
#modal.full{align-items:stretch;justify-content:stretch;background:rgba(40,22,8,.78)}
#modal.full .sheet.pick.full{max-width:none;width:100%;max-height:none;height:100vh;height:100dvh;border-radius:0;border-top:0;
  padding:calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) calc(16px + var(--sr)) calc(12px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))) calc(16px + var(--sl));
  display:flex;flex-direction:column;gap:8px;overflow:auto}
.sheet.pick.full h2{font-size:22px;margin:0;text-align:center}
.sheet.pick.full .sub{text-align:center;margin:0}
.sheet.pick.full .vs,.sheet.pick.full .tipline{margin:0}
.augc{display:flex;flex-direction:column;gap:6px;min-width:0}
.augc .aug{margin:0;flex:1}
.augc .reroll{align-self:center;padding:6px 16px;font-size:14px;border-style:dashed}
.augc .reroll:disabled{opacity:.5}
.augc.rolled .aug{animation:rollin .35s ease-out}
@keyframes rollin{from{transform:rotateY(80deg) scale(.9);opacity:.3}to{transform:none;opacity:1}}
.sheet.pick.full .big.wide{margin:4px auto 0;max-width:520px;flex:none}
@media (orientation:landscape) and (max-height:600px), (orientation:landscape) and (min-width:900px){
  .sheet.pick.full{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr));align-content:center;gap:8px 12px}
  .sheet.pick.full>*:not(.augc){grid-column:1/-1}
  .sheet.pick.full>.augc{grid-column:auto}
  .sheet.pick.full .augc .aug{flex-direction:column;align-items:center;text-align:center;justify-content:center;position:relative;padding:14px 12px}
  .sheet.pick.full .augc .aug .tx{align-items:center}
  .sheet.pick.full .augc .aug .tx b{justify-content:center;font-size:18px}
  .sheet.pick.full .augc .aug .tx span{font-size:13px}
  .sheet.pick.full .augc .aug .ic,.sheet.pick.full .augc .aug .ic .ico{width:56px;height:56px;font-size:36px}
  .sheet.pick.full .augc .aug .ck{position:absolute;top:8px;right:8px}
  .sheet.pick.full .vs .side img{display:none}
  /* 가로는 높이가 낮아(412px 등) 촘촘하게: 설명 줄은 버튼이 대신하고, 확인 버튼은 덮지 않게 */
  .sheet.pick.full{gap:6px 12px;padding-top:calc(8px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));padding-bottom:calc(8px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))}
  .sheet.pick.full h2{font-size:20px}
  .sheet.pick.full .sub{display:none}
  .sheet.pick.full .augc .aug{padding:8px 10px;gap:4px}
  .sheet.pick.full .augc .aug .ic,.sheet.pick.full .augc .aug .ic .ico{width:44px;height:44px;font-size:30px}
  .sheet.pick.full .augc .aug .tx b{font-size:17px}
  .sheet.pick.full .augc .reroll{padding:4px 14px;font-size:13px}
  .sheet.pick.full .big.wide{position:static;box-shadow:0 4px 0 var(--accent-d);padding:10px;margin:2px auto 0}
  .sheet.pick.full .big.wide:disabled{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){.augc.rolled .aug{animation:none}}
body:has(#modal.full:not([hidden])) #mute{display:none}
/* 큰 가로 화면(높이 600 넘음): 증강체 카드를 키워 위아래가 비지 않게 */
@media (orientation:landscape) and (min-height:601px){
  #modal.full .sheet.pick.full{padding-left:max(24px,calc((100vw - 1200px)/2));padding-right:max(24px,calc((100vw - 1200px)/2));gap:12px 18px}
  .sheet.pick.full h2{font-size:30px}
  .sheet.pick.full .augc .aug{min-height:min(42vh,380px);gap:10px;justify-content:center}
  .sheet.pick.full .augc .aug .tx{flex:0 0 auto}
  .sheet.pick.full .vs{font-size:16px;padding:10px}
  .sheet.pick.full .tipline{font-size:15px;padding:10px 14px}
  .sheet.pick.full .augc .aug .ic,.sheet.pick.full .augc .aug .ic .ico{width:88px;height:88px;font-size:56px}
  .sheet.pick.full .augc .aug .tx b{font-size:26px}
  .sheet.pick.full .augc .aug .tx small{font-size:15px}
  .sheet.pick.full .augc .aug .tx span{font-size:17px}
  .sheet.pick.full .augc .reroll{font-size:16px;padding:8px 20px}
  .sheet.pick.full .big.wide{font-size:22px;padding:14px}
}

/* ── v0.9.94 게임 전체 검토 ── */
/* 창(시트)이 열리면 오른쪽 위 ⚙️를 숨김(창 모서리를 가리던 것) */
body:has(#modal:not([hidden])) #mute{display:none}
/* 뒤로 버튼: 작은 「‹」 글자 → 「내 갈매미」의 「‹ 게임으로」와 같은 팻말 */
header .back{font-size:18px;line-height:1;padding:7px 14px;border-radius:999px;border:2.5px solid var(--edge);background:linear-gradient(#fffdf5,#f1d9a8);color:var(--ink);box-shadow:0 3px 0 var(--edge);font-family:"Black Han Sans",sans-serif;margin-right:8px}
header .back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
/* 고른 것 표시 = 주요 행동 색(금빛은 진행·보상만) */
.seg button.on{background:var(--accent);color:var(--on-accent)}
.card .n{background:var(--accent);color:var(--on-accent);border:2px solid var(--accent-d)}
.card.on{border-color:var(--accent-d) !important}
/* 결과 창 첫 버튼(다음으로 등)은 주요 행동(.sw button 크림 규칙이 덮던 것) */
.sw button.big{background:linear-gradient(var(--accent-hi),var(--accent));color:var(--on-accent);border:2px solid var(--accent-d);box-shadow:0 4px 0 var(--accent-d)}
@media (orientation:landscape){
  /* 팀 고르기: 가로에서 한 줄 3장 → 6장(33종을 덜 내려 보며 고름) */
  .grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding-bottom:110px}
  /* 증강체 + 다음 갈매미를 한 화면에서: 나갈 갈매미는 한 줄에 나란히 작게, 도움말은 빼서 스크롤 없이 */
  .sheet.pick.full>.aug{grid-column:auto !important;flex-direction:row !important;align-items:center !important;padding:6px 10px !important;margin:0 !important}
  .sheet.pick.full>.aug .ic{width:44px;height:44px}
  .sheet.pick.full>.aug .tx b{font-size:15px}
  .sheet.pick.full.both .tipline,.sheet.pick.full.both .vs{display:none}
  .sheet.pick.full.both .augc .aug{padding:6px 8px}
  .sheet.pick.full.both .augc .aug .tx span{font-size:12px}
  .sheet.pick.full.both h2{font-size:17px}
  .card b{font-size:12px}
}

/* 메뉴 아이콘 그림(GPT 할 일 34): 동그란 칸 밖으로 살짝 튀어나오게 크게 */
.dock a i.art{overflow:visible}
.dock a i.art .ico{width:118%;height:118%;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(60,35,15,.35))}

/* 몸 크기 맞춤(v0.9.98): --sz = 갈매미별 배율(duel.js BODY). 발 위치는 그대로, 위로만 커짐 */
.mon.me{height:calc(66% * min(var(--sz,1), 1.25));max-width:56%;object-fit:contain;object-position:0 100%}   /* 내 쪽은 이미 커서 1.25배까지만, 가로는 전투 칸의 56%까지(넓은 그림이 상대를 가리지 않게) */
.mon.foe{height:calc(30% * var(--sz,1));top:calc(var(--hz) + 7% - 30% * var(--sz,1))}
.mon.foe.boss{height:calc(38% * var(--sz,1));top:calc(var(--hz) + 7% - 38% * var(--sz,1))}
@media (orientation:landscape) and (max-height:600px), (orientation:landscape) and (min-width:900px){
  .por{height:calc(62% * var(--sz,1));max-width:calc(34% * var(--sz,1))}
  .por.me{transform-origin:50% 100%}
}

/* 게임 안 확인 창(기본 팝업 대신, v0.9.99) */
.gdlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(40,22,8,.55);padding:16px;animation:gdlgIn .15s ease-out}
.gdlg-box{width:min(440px,100%);background:#fffaf0;border:3px solid #7a4e2a;border-radius:20px;box-shadow:0 6px 0 rgba(90,52,22,.45),0 16px 40px rgba(0,0,0,.35);padding:20px 20px 16px;color:#3b2614;text-align:center}
.gdlg-box p{margin:4px 0 18px;font-size:17px;line-height:1.55;white-space:pre-line;word-break:keep-all}
.gdlg-row{display:flex;gap:10px;justify-content:center}
.gdlg-row button{flex:1;max-width:180px;padding:11px 14px;border-radius:999px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.gdlg-no{background:#fffaf0;color:#3b2614;border:2px solid #7a4e2a;box-shadow:0 3px 0 rgba(90,52,22,.45)}
.gdlg-ok{background:linear-gradient(#f0bd85,#dd9a58);color:#3b2614;border:2px solid #7a4e2a;box-shadow:0 3px 0 #7a4e2a}
.gdlg-ok.danger{background:linear-gradient(#e25c4a,#c53b25);color:#fff;border-color:#7a1f12;box-shadow:0 3px 0 #7a1f12}
.gdlg-row button:active{transform:translateY(2px)}
@keyframes gdlgIn{from{opacity:0}to{opacity:1}}

/* 설정 음량 조절(v0.9.99) */
.setrow.vol input[type=range]{flex:1;min-width:0;accent-color:#c98443;height:28px}
.setrow.vol b{min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
.setrow.vol span{white-space:nowrap}
.setrow.vol.off{opacity:.5}

/* 상대 정보(v0.9.99) */
.box.foe .finfo{position:absolute;top:6px;right:-8px;transform:translateX(100%);padding:5px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#fffaf0;color:#3b2614;border:2px solid #7a4e2a;box-shadow:0 2px 0 rgba(90,52,22,.45);white-space:nowrap;pointer-events:auto}
.box.foe .finfo:disabled{opacity:.55;box-shadow:none}
.finfo-sheet .stats{margin:6px 0 10px}

/* 로비 가운데 정렬(v0.9.99): 가운데 이야기 칸·이어하기, 양옆에 내 수비대, 아래 가운데 메뉴 */
.sqL,.sqR{display:none}
.now .recap{margin:2px 0 8px;font-size:12.5px;line-height:1.45;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
@media (orientation:landscape) and (max-height:600px), (orientation:landscape) and (min-width:900px){
  .ts{grid-template-columns:minmax(0,1fr) minmax(0,min(540px,46vw)) minmax(0,1fr) !important;grid-template-rows:minmax(0,1fr) auto !important;gap:8px 14px !important}
  .ts .squad{display:none !important}
  .tmid{grid-column:2 !important;grid-row:1 !important;align-self:center !important;text-align:center}
  .now{text-align:center !important}
  .now .prog{margin:0 34px 0 0}
  .dock{grid-column:1/4 !important;grid-row:2 !important;justify-self:center;width:min(640px,100%);margin:0 !important}
  .sqL,.sqR{display:flex;grid-row:1;align-items:flex-end;justify-content:center;min-width:0;padding-bottom:4px;position:relative;z-index:1}
  .sqL{grid-column:1}.sqR{grid-column:3;gap:2%}
  .sqL img,.sqR img{height:calc(min(42vh,240px) * min(var(--sz,1),1.3));max-width:100%;object-fit:contain;object-position:50% 100%;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
  .sqR img{max-width:50%;height:calc(min(36vh,200px) * min(var(--sz,1),1.3))}
  .sqL img.flip{transform:scaleX(-1)}
}
@media (prefers-reduced-motion:reduce){.sqL img,.sqR img{animation:none}}

/* 설정 창 두 칸(v0.9.99): 가로 화면에서 소리 | 계정·쿠폰으로 나눠 스크롤 없이. 오른쪽 위 ✕ */
.sheet.set h2{display:flex;align-items:center;justify-content:space-between}
.sheet.set .xbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--edge);background:#fffaf0;color:var(--ink);font-size:16px;line-height:1;box-shadow:0 2px 0 rgba(90,52,22,.4)}
@media (orientation:landscape) and (max-height:600px){
  .sheet.set{max-width:min(920px,96vw) !important}
  .sheet.set .scols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  .sheet.set #sClose{display:none}
}
/* 낮은 가로 화면(높이 400 이하): 로비·증강체 촘촘하게 */
@media (orientation:landscape) and (max-height:400px){
  .now{padding:6px 12px 8px !important}
  .now b{font-size:18px !important;margin:0 0 2px !important}
  .now .recap{margin:0 0 6px;-webkit-line-clamp:1}
  .play{padding:10px !important;font-size:20px !important}
  .two button{padding:8px !important}
  .dock{padding:6px 6px 4px !important}
  .dock a i{width:44px !important;height:44px !important}
  .sheet.pick.full .tipline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:min-content;padding:5px 10px;font-size:12px}   /* overflow:hidden이면 격자 칸이 0까지 줄어 글자가 잘리던 것(v0.10.5) */
  .sheet.pick.full .vs{padding:4px 8px}
  .sheet.pick.full:not(.both){grid-template-rows:auto auto auto minmax(0,1fr) auto;align-content:stretch}
  .sheet.pick.full:not(.both):not(:has(.tipline)){grid-template-rows:auto auto minmax(0,1fr) auto}   /* 안내 줄은 첫 턴에만 */
  .sheet.pick.full:not(.both) .augc{min-height:0}
  .sheet.pick.full:not(.both) .augc .aug{min-height:0;overflow:hidden}
  .sheet.pick.full .augc .aug .tx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}
@media (orientation:landscape) and (max-height:340px){ .sheet.pick.full .tipline,.sheet.pick.full .vs{display:none} }

/* 설정 두 칸: 오른쪽 칸 버튼이 창 밖으로 잘리던 것 */
@media (orientation:landscape) and (max-height:600px){ .sheet.set .scols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sheet.set .scol{min-width:0}
.sheet.set .setrow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet.set .setrow>button{flex:none}
/* 전투 오른쪽 칸: 아이템·도망치기를 한 줄로(낮은 화면에서 도망치기가 잘리던 것) */
#panel .fleerow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:nowrap}
#panel .fleerow .flee{align-self:auto}

.finfo-sheet .fi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.finfo-sheet .fi-k{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.finfo-sheet .fi-k b{font-size:15px}
.finfo-sheet .fi-k small{color:var(--dim);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.finfo-sheet h2{margin:8px 0 4px}
@media (orientation:landscape) and (max-height:600px){ .sheet.finfo-sheet{max-width:min(920px,96vw) !important} .finfo-sheet .stats{grid-template-columns:repeat(6,1fr)} }

/* ════ 로비 v1.0(한국 수집형 게임 로비 구조): 위 프로필·재화 / 왼쪽 입구 / 가운데 대표 갈매미 / 오른쪽 이야기·이어하기 / 아래 메뉴 ════ */
.ts.lobby{display:flex;flex-direction:column;gap:10px;padding:calc(10px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) calc(14px + var(--sr,0px)) calc(10px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))) calc(14px + var(--sl,0px))}
.ts.lobby>*:not(.lbg):not(.amb){position:relative;z-index:1}
.ltop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:64px}
.lprof{display:flex;align-items:center;gap:8px;background:rgba(255,250,240,.94);border:2.5px solid var(--edge);border-radius:999px;padding:4px 16px 4px 5px;box-shadow:0 3px 0 rgba(60,35,15,.4)}
.lprof>i{font-style:normal;font-size:20px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf5,#f6e2b8);border:2px solid var(--edge)}
.lprof span{display:flex;flex-direction:column;line-height:1.15}
.lprof b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:16px;color:var(--ink)}
.lprof small{font-size:11.5px;color:var(--dim)}
.lcur{display:flex;gap:6px}
.lcur span{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;background:rgba(255,250,240,.94);border:2px solid var(--edge);font-size:13px;color:var(--ink);box-shadow:0 2px 0 rgba(60,35,15,.35);white-space:nowrap}
.lcur b{font-weight:700}
.lside{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.lside button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:78px;padding:8px 4px 6px;border-radius:18px;background:rgba(255,250,240,.95);border:2.5px solid var(--edge);box-shadow:0 4px 0 rgba(60,35,15,.45);color:var(--ink);font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:13px}
.lside button i{font-style:normal;font-size:26px;line-height:1}
.lside button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(60,35,15,.45)}
.lhero{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lhero img{position:relative;z-index:1;height:calc(min(56vh,300px) * min(var(--sz,1),1.45));max-width:100%;object-fit:contain;object-position:50% 100%;margin-bottom:26px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.lplat{position:absolute;bottom:14px;left:50%;width:min(70%,320px);height:38px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(255,226,150,.65),rgba(255,210,120,.18) 60%,transparent 72%)}
.lname{position:absolute;z-index:2;bottom:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;background:rgba(255,250,240,.96);border:2.5px solid var(--edge);border-radius:12px;padding:3px 12px;box-shadow:0 3px 0 rgba(60,35,15,.4)}
.lname b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:15px;color:var(--ink)}
.lname small{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)}
.lbub{position:absolute;z-index:3;top:4%;left:50%;transform:translateX(-50%);max-width:min(90%,360px);background:#fffaf0;border:2.5px solid var(--edge);border-radius:16px;padding:8px 14px;font-size:14px;line-height:1.45;color:var(--ink);box-shadow:0 4px 0 rgba(60,35,15,.35);text-align:center;word-break:keep-all}
.lbub::after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;transform:translateX(-50%) rotate(45deg);background:#fffaf0;border-right:2.5px solid var(--edge);border-bottom:2.5px solid var(--edge)}
.lbub.pop{animation:bubPop .25s ease-out}
@keyframes bubPop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.lnoteam{margin:auto;padding:16px 22px;border-radius:18px;background:rgba(255,250,240,.95);border:2.5px dashed var(--edge);color:var(--ink);font-size:15px;line-height:1.5}
.lstory{display:flex;flex-direction:column;gap:8px;justify-content:center}
.lstory .now{text-align:left !important;margin:0 !important}
.lstory .play{margin:0 !important;font-size:24px}
.ts.lobby .dock{margin:0 !important}
.dot{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#e2402a;border:2px solid #fffaf0;box-shadow:0 1px 2px rgba(0,0,0,.3);animation:dotPulse 1.6s ease-in-out infinite}
.dock a{position:relative}
.dock a .dot{top:0;right:calc(50% - 30px)}
@keyframes dotPulse{50%{transform:scale(1.2)}}
@media (orientation:landscape) and (max-height:600px), (orientation:landscape) and (min-width:900px){
  .ts.lobby{height:100vh;height:100dvh;min-height:0 !important;display:grid !important;grid-template-columns:auto minmax(0,1fr) minmax(0,min(400px,40vw)) !important;grid-template-rows:auto minmax(0,1fr) auto !important;gap:6px 16px !important}
  .ltop{grid-column:1/4;grid-row:1}
  .lside{grid-column:1;grid-row:2}
  .lhero{grid-column:2;grid-row:2}
  .lstory{grid-column:3;grid-row:2}
  .ts.lobby .dock{grid-column:1/4 !important;grid-row:3 !important;justify-self:center;width:min(640px,100%)}
}
@media (orientation:landscape) and (max-height:400px){
  .lside button{width:68px;padding:6px 4px 4px}.lside button i{font-size:22px}
  .lprof>i{width:30px;height:30px;font-size:17px}.lprof b{font-size:14px}
  .lhero img{margin-bottom:22px}

}
@media (prefers-reduced-motion:reduce){.lhero img,.dot{animation:none}}

/* 로비: 가운데 칸 높이를 넘지 않게(낮은 화면에서 그림·이어하기가 아래 메뉴에 덮이던 것) */
.ts.lobby .lhero,.ts.lobby .lstory{min-height:0;overflow:visible}
.lhero img{max-height:calc(100% - 26px)}
.lhero{height:100%}
@media (orientation:landscape) and (max-height:400px){
  .ts.lobby{gap:4px 14px !important;padding-top:calc(6px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));padding-bottom:calc(6px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))}

  .lprof{padding:2px 12px 2px 3px}.lcur span{padding:2px 10px;font-size:12px}
  .lstory{gap:6px}.lstory .now .prog{height:8px}
