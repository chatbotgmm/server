<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b2a3a">
<title>갈매미맨: 수비대 대결 (시험판)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root{--bg:#1b2a3a;--card:#24384c;--ink:#fff;--sub:#c9d6e2;--gold:#ffe9a8;--hp:#5fd17a;--mid:#f2c14e;--low:#e2554f}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Jua,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:10px}
  h1,h2,h3{font-weight:normal;margin:0}
  h1{font-size:34px}h2{font-size:24px}h3{font-size:19px}
  p{margin:0;line-height:1.55;color:var(--sub)}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .btn{background:var(--gold);color:var(--bg);border-radius:14px;padding:12px 18px;font-size:20px}
  .btn.ghost{background:transparent;color:var(--sub);border:2px solid #3d5670}
  .btn:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}
  .top{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--sub)}
  .chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:14px;color:#fff;line-height:1.6}
  .tier{display:inline-block;border-radius:6px;padding:0 6px;font-size:13px;background:#3d5670;color:#fff;line-height:1.6}
  .tier.LEGEND{background:#c9832e}.tier.RARE{background:#4f6fd0}.tier.SPECIAL{background:#3fa58a}.tier.UNCOMMON{background:#6b8c3a}
  /* 메달: 카드 그림에서 테두리·이름판을 잘라 동그랗게 */
  .med{position:relative;border-radius:50%;overflow:hidden;background:#33495f;border:4px solid #e9dcc0;box-shadow:0 6px 0 rgba(0,0,0,.25);flex:none}
  .med img{position:absolute;width:150%;height:150%;left:-25%;top:-17%;object-fit:cover;pointer-events:none}
  .field{position:relative;background:linear-gradient(#8ec9ef 0%,#cfe9f8 48%,#4f9fd1 48%,#3f8bbd 100%);border-radius:18px;padding:14px;height:min(62vw,330px);overflow:hidden}
  .field::after{content:'';position:absolute;left:-10%;right:-10%;bottom:-30px;height:46%;background:#b8ad97;border-radius:50% 50% 0 0;box-shadow:inset 0 8px 0 #d8cfb9}
  .slot{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .slot.foe{right:7%;top:8%}.slot.me{left:7%;bottom:6%}
  .slot .med{width:min(30vw,150px);height:min(30vw,150px)}
  .slot.me .med{width:min(34vw,170px);height:min(34vw,170px)}
  .panel{position:absolute;z-index:2;background:rgba(27,42,58,.88);border-radius:12px;padding:7px 10px;width:min(48%,240px)}
  .panel.foe{left:10px;top:10px}.panel.me{right:10px;bottom:10px}
  .panel .nm{font-size:17px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .bar{height:10px;border-radius:6px;background:#0e1822;margin-top:5px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--hp);transition:width .45s,background .45s}
  .hpt{font-size:13px;color:var(--sub);margin-top:2px;display:flex;justify-content:space-between}
  .st{font-size:13px;color:var(--gold)}
  .log{background:var(--card);border-radius:14px;padding:10px 14px;min-height:62px;font-size:18px;line-height:1.5}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .act{background:var(--card);border-radius:14px;padding:10px 12px;text-align:left;border:2px solid transparent}
  .act b{display:block;font-weight:normal;font-size:19px}
  .act small{color:var(--sub);font-size:13px}
  .act:disabled{opacity:.45}
  .act:not(:disabled):active{border-color:var(--gold)}
  .bench{display:flex;gap:8px}
  .bm{flex:1;min-width:0;display:flex;gap:6px;align-items:center;background:var(--card);border-radius:12px;padding:6px;font-size:13px;border:2px solid transparent}
  .bm .med{width:38px;height:38px;border-width:2px}
  .bm.on{border-color:var(--gold)}.bm.down{opacity:.35}
  .bm .bar{height:6px;margin-top:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .pick{background:var(--card);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:3px solid transparent}
  .pick .med{width:84px;height:84px}
  .pick.sel{border-color:var(--gold)}
  .pick small{color:var(--sub);font-size:13px}
  .aug{background:var(--card);border-radius:14px;padding:14px;text-align:left;border:3px solid #3d5670}
  .aug.silver{border-color:#b9c3cc}.aug.gold{border-color:#e0b64a}.aug.prism{border-color:#c792ea;background:linear-gradient(135deg,#2c3f5a,#3b2d55)}
  .aug b{font-weight:normal;font-size:21px;display:block}
  .aug small{display:block;color:var(--sub);font-size:13px;margin-bottom:4px}
  .augs{display:flex;gap:6px;flex-wrap:wrap}
  .augs span{font-size:13px;background:#2e4660;border-radius:8px;padding:2px 8px;color:var(--sub)}
  .float{position:absolute;z-index:3;font-size:26px;color:#fff;text-shadow:0 2px 0 #1b2a3a,0 0 4px #1b2a3a;animation:fl .8s ease-out forwards;pointer-events:none}
  @keyframes fl{to{transform:translateY(-40px);opacity:0}}
  .lunge-me{animation:lm .35s}.lunge-foe{animation:lf .35s}
  @keyframes lm{50%{transform:translate(30px,-20px)}}@keyframes lf{50%{transform:translate(-30px,20px)}}
  .hit{animation:hit .4s}
  @keyframes hit{20%,60%{transform:translateX(-8px);filter:brightness(1.6) saturate(.4)}40%,80%{transform:translateX(8px)}}
  .faint{transition:transform .5s,opacity .5s;transform:translateY(30px);opacity:0}
  .enter{animation:en .4s}
  @keyframes en{from{transform:scale(.3);opacity:0}}
  table.chart{border-collapse:collapse;width:100%;font-size:15px}
  table.chart td{padding:6px 4px;border-bottom:1px solid #2e4660;color:var(--sub)}
  .center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/battle/battle.js"></script>
</body>
</html>
