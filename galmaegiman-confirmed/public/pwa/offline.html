<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>연결 끊김 · 갈매미맨</title><meta name="theme-color" content="#164b80">
<style>
:root{--bg:#f7f0e3;--card:#fffdf8;--text:#2d2a26;--muted:#6f675c;--line:#e8dcc6}
@media (prefers-color-scheme:dark){:root{--bg:#121820;--card:#1c242e;--text:#ececec;--muted:#a3a9b1;--line:#2d3845}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px;box-sizing:border-box}
.c{max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}
img{width:96px;height:96px}h1{font-size:1.3rem;margin:8px 0}p{color:var(--muted);line-height:1.6}
button{border:0;border-radius:999px;padding:12px 22px;background:#1d5b94;color:#fff;font:inherit;font-size:1rem;box-shadow:0 3px 0 #164b80;cursor:pointer}
</style></head><body><div class="c"><img src="/gull.png" alt=""><h1>인터넷 연결이 끊겼어요</h1>
<p>갈매미들이 항구에서 기다리고 있어요.<br>연결되면 다시 눌러 주세요.</p><button onclick="location.reload()">다시 시도</button></div></body></html>
