name: Android Parchment Preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag, or commit SHA"
        required: true
        default: "manual/native79-parchment"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Record source commit
        shell: bash
        run: |
          echo "Built source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate parchment preview
        shell: bash
        run: python3 apply-native-parchment.py

      - name: Test theme and material
        working-directory: galmaegiman-confirmed/app/android
        shell: bash
        run: |
          bash ./gradlew :app:testDebugUnitTest --tests org.dpdns.gmm.JournalThemeTest --tests org.dpdns.gmm.JournalMaterialTest --no-daemon --max-workers=2 --stacktrace "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

      - name: Build debug APK
        working-directory: galmaegiman-confirmed/app/android
        shell: bash
        run: |
          bash ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload parchment preview APK
        uses: actions/upload-artifact@v7
        with:
          name: native79-parchment-preview-${{ github.run_number }}
          path: galmaegiman-confirmed/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parchment-test-reports-${{ github.run_number }}
          path: |
            galmaegiman-confirmed/app/android/app/build/reports/tests/testDebugUnitTest/
            galmaegiman-confirmed/app/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 3