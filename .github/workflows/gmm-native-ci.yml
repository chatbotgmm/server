# 갈매미맨 반복 빌드: 저장소에 풀어 둔 소스를 그대로 검사·빌드한다(ZIP 적용 단계 없음).
# 결과물: 미리보기 APK(기존 앱 옆에 따로 설치), 디버그 APK, 단위 테스트 보고서, 화면 캡처(PNG + findings.json).
# 운영 서버·DB 배포, 릴리스 서명은 하지 않는다.
# 미리보기 APK는 GitHub Releases(비공개 저장소: 권한 있는 계정만)에도 올려 휴대폰에서 ZIP 없이 바로 받게 한다.
# 항상 최신: https://github.com/chatbotgmm/server/releases/latest
name: GMM native CI

on:
  push:
    branches:
      - claude/new-session-fma5lb
      - manual/rebuild-r1-20261019
    paths:
      - galmaegiman-confirmed/**
      - .github/workflows/gmm-native-ci.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gmm-native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: galmaegiman-confirmed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: galmaegiman-confirmed/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma client
        run: npm run db:generate
      - name: TypeScript
        run: npx --no-install tsc --noEmit
      - name: Focused server tests
        run: >
          npx --no-install vitest run
          test/casual-balance.test.ts test/casual-growth.integration.test.ts
          test/realtime-ranked-client.test.ts test/realtime-ranked-wait-copy.test.ts
          --maxWorkers=1
      - name: Disposable-DB regression
        run: node scripts/verify/run-casual-regression.mjs

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: galmaegiman-confirmed/app/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests, screen captures, debug and preview APKs
        run: >
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assemblePreview
          --no-daemon --max-workers=2 --stacktrace
          "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      - name: APK identity
        if: success()
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          for f in app/build/outputs/apk/preview/app-preview.apk app/build/outputs/apk/debug/app-debug.apk; do
            "$AAPT" dump badging "$f" | grep -E "^package|application-label:" | tee -a "$GITHUB_STEP_SUMMARY"
            sha256sum "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo 'preview APK = 기존 앱과 다른 패키지(.r1preview)로 따로 설치됨. 업데이트 설치가 아님. 디버그 서명은 실행마다 다를 수 있음.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save preview APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: gmm-preview-apk
          path: galmaegiman-confirmed/app/android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save screen captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gmm-screen-review
          path: galmaegiman-confirmed/app/android/app/build/native-review/r1/
          if-no-files-found: warn
          retention-days: 14
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gmm-native-test-reports
          path: |
            galmaegiman-confirmed/app/android/app/build/reports/tests/
            galmaegiman-confirmed/app/android/app/build/test-results/
          retention-days: 7

  release:
    needs: [server, native]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: gmm-preview-apk
          path: apk
      - name: Publish preview APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          short="${SHA:0:7}"
          tag="r1-preview-$short"
          file="galmaegiman-preview-$short.apk"
          mv apk/app-preview.apk "$file"
          sum=$(sha256sum "$file" | cut -d' ' -f1)
          cat > notes.md <<EOF
          갈매미맨 **미리보기판** · 커밋 \`$short\` (브랜치 \`$BRANCH\`)

          - 패키지 \`org.dpdns.gmm.native.revised.r1preview\` · 앱 이름 「갈매미맨 미리보기」 · 버전 \`2.2.4-native-r1preview-$short\`
          - 기존 정식 앱 옆에 **따로 설치**된다(업데이트 설치 아님). 기존 앱은 지우지 않는다.
          - 디버그 서명은 빌드마다 다를 수 있다. 설치 중 「충돌」이 나면 **미리보기 앱만** 지우고 다시 설치한다.
          - 운영 서버·실제 계정에 접속한다. 운영 서버에는 r1 서버 변경이 배포되지 않았다.
          - 실기기 검수 전 시험판이다.
          - SHA-256 \`$sum\`
          EOF
          sed -i 's/^          //' notes.md
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --repo "$REPO" --clobber
          else
            gh release create "$tag" "$file" --repo "$REPO" --target "$SHA" \
              --title "미리보기 $short" --notes-file notes.md --latest
          fi
