          import json, os, time, urllib.request, urllib.error

          REPO = "chatbotgmm/server"
          BRANCH = "refs/heads/manual/home-assembly-20261019"
          BASE = "680cc3565aafddcd262541faed44b6a333dde912"
          PATH = ".github/workflows/approved-artifact-cleanup-20261020.yml"
          SENTINEL = 'chore: approved artifact cleanup 20261020 [277-exact-artifacts]'
          PRESERVE_RUN = 39286785573
          AUTHORIZED = json.loads(os.environ["APPROVED_ARTIFACTS"])

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("Unexpected API redirect; stopped")

          def api(method, path):
              if not path.startswith("/repos/" + REPO + "/"):
                  raise RuntimeError("Unexpected repository path")
              req = urllib.request.Request("https://api.github.com" + path, method=method, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2026-03-10",
                  "User-Agent": "approved-artifact-cleanup-20261020",
              })
              try:
                  with urllib.request.build_opener(NoRedirect()).open(req, timeout=30) as res:
                      data = res.read()
                      return res.status, json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise RuntimeError(f"API {method} failed with HTTP {exc.code}") from None
              except urllib.error.URLError:
                  raise RuntimeError("API transport failure; stopped without retry") from None

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def inspect(row):
              aid, run, size, name = row
              status, data = api("GET", f"/repos/{REPO}/actions/artifacts/{aid}")
              if status == 404:
                  return False
              require(status == 200, f"Unexpected GET status for artifact {aid}")
              require(data.get("id") == aid and data.get("name") == name
                      and data.get("size_in_bytes") == size
                      and data.get("workflow_run", {}).get("id") == run
                      and run != PRESERVE_RUN, f"Manifest mismatch for artifact {aid}; stopped")
              return True

          def main():
              with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
                  event = json.load(event_file)
              require(os.environ.get("GITHUB_REPOSITORY") == REPO
                      and os.environ.get("GITHUB_EVENT_NAME") == "push"
                      and os.environ.get("GITHUB_REF") == BRANCH
                      and os.environ.get("GITHUB_RUN_ATTEMPT") == "1"
                      and event.get("before") == BASE
                      and event.get("after") == os.environ.get("GITHUB_SHA")
                      and event.get("head_commit", {}).get("message") == SENTINEL
                      and not event.get("forced") and not event.get("deleted"), "Event guard rejected execution")
              status, commit = api("GET", f"/repos/{REPO}/commits/{os.environ['GITHUB_SHA']}")
              require(status == 200 and [p["sha"] for p in commit.get("parents", [])] == [BASE]
                      and commit.get("commit", {}).get("message") == SENTINEL
                      and len(commit.get("files", [])) == 1
                      and commit["files"][0].get("filename") == PATH
                      and commit["files"][0].get("status") == "added", "Commit guard rejected execution")
              require(len(AUTHORIZED) == 277 and len({r[0] for r in AUTHORIZED}) == 277
                      and sum(r[2] for r in AUTHORIZED) == 13038727735
                      and all(r[1] != PRESERVE_RUN for r in AUTHORIZED), "Invalid manifest")
              status, preserved = api("GET", f"/repos/{REPO}/actions/runs/{PRESERVE_RUN}")
              require(status == 200 and preserved.get("id") == PRESERVE_RUN
                      and preserved.get("run_number") == 34
                      and preserved.get("conclusion") == "success", "Preserved run verification failed")
              # Validate the entire manifest before any mutation. Revalidate immediately before each DELETE.
              for row in AUTHORIZED:
                  inspect(row)
              deleted = missing = deleted_bytes = 0
              for row in AUTHORIZED:
                  aid, run, size, name = row
                  if not inspect(row):
                      missing += 1
                      print(f"already_absent artifact_id={aid}", flush=True)
                      continue
                  status, _ = api("DELETE", f"/repos/{REPO}/actions/artifacts/{aid}")
                  require(status in (204, 404), f"Unexpected DELETE status for artifact {aid}")
                  if status == 204:
                      deleted += 1
                      deleted_bytes += size
                      print(f"deleted artifact_id={aid} bytes={size}", flush=True)
                  else:
                      missing += 1
                      print(f"already_absent artifact_id={aid}", flush=True)
                  time.sleep(1.1)  # Stay below the secondary content-generation rate limit.
              for row in AUTHORIZED:
                  require(not inspect(row), f"Artifact {row[0]} remains after cleanup")
              print(f"VERIFIED deleted_count={deleted} deleted_bytes={deleted_bytes} already_absent_count={missing} authorized_count=277 authorized_bytes=13038727735 preserved_run={PRESERVE_RUN}", flush=True)

          if __name__ == "__main__":
              main()
          PYTHON
